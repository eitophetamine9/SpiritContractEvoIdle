<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .a-silver{ fill: #dcdde1; }
      .a-white { fill: #f5f6fa; }
      .a-cyan  { fill: #00d2d3; }
      .a-green { fill: #2ed573; }
      .a-gold  { fill: #ffd32a; }
      .a-shadow{ fill: rgba(0,0,0,0.3); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="12" ry="3.5" class="a-shadow"/>
    <!-- Crescent Bow Stave -->
    <path d="M16,10 Q28,24 16,38 Q22,24 16,10 Z" class="a-silver"/>
    <path d="M17,12 Q26,24 17,36" stroke="#ffffff" stroke-width="1" fill="none"/>
    <!-- Bowstring -->
    <line x1="16" y1="10" x2="16" y2="38" stroke="#00d2d3" stroke-width="1"/>
    <!-- Center Grip & Moon Gem -->
    <circle cx="21" cy="24" r="3.5" class="a-cyan"/>
    <circle cx="21" cy="24" r="2" class="a-white"/>
    <polygon points="16,22 19,24 16,26" class="a-gold"/>
  </g>

  <!-- Frame 1: Idle 2 [48..96] -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="10" ry="3" class="a-shadow"/>
    <path d="M16,8 Q28,22 16,36 Q22,22 16,8 Z" class="a-silver"/>
    <path d="M17,10 Q26,22 17,34" stroke="#ffffff" stroke-width="1" fill="none"/>
    <line x1="16" y1="8" x2="16" y2="36" stroke="#00d2d3" stroke-width="1"/>
    <circle cx="21" cy="22" r="4" class="a-cyan"/>
    <circle cx="21" cy="22" r="2" class="a-white"/>
    <polygon points="16,20 19,22 16,24" class="a-gold"/>
    <circle cx="28" cy="15" r="1.5" class="a-white"/>
  </g>

  <!-- Frame 2: Idle 3 [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="9" ry="2.8" class="a-shadow"/>
    <path d="M16,7 Q28,21 16,35 Q22,21 16,7 Z" class="a-silver"/>
    <path d="M17,9 Q26,21 17,33" stroke="#ffffff" stroke-width="1" fill="none"/>
    <line x1="16" y1="7" x2="16" y2="35" stroke="#00d2d3" stroke-width="1"/>
    <circle cx="21" cy="21" r="4.5" class="a-cyan"/>
    <circle cx="21" cy="21" r="2.5" class="a-white"/>
    <polygon points="16,19 19,21 16,23" class="a-gold"/>
    <circle cx="10" cy="16" r="1.5" class="a-green"/>
  </g>

  <!-- Frame 3: Idle 4 [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43" rx="11" ry="3.2" class="a-shadow"/>
    <path d="M16,9 Q28,23 16,37 Q22,23 16,9 Z" class="a-silver"/>
    <path d="M17,11 Q26,23 17,35" stroke="#ffffff" stroke-width="1" fill="none"/>
    <line x1="16" y1="9" x2="16" y2="37" stroke="#00d2d3" stroke-width="1"/>
    <circle cx="21" cy="23" r="3.5" class="a-cyan"/>
    <circle cx="21" cy="23" r="2" class="a-white"/>
    <polygon points="16,21 19,23 16,25" class="a-gold"/>
  </g>

  <!-- Frame 4: Pulse 1 [192..240] -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="43" rx="12" ry="3.5" class="a-shadow"/>
    <path d="M16,10 Q29,24 16,38 Q22,24 16,10 Z" class="a-white"/>
    <line x1="16" y1="10" x2="16" y2="38" stroke="#00d2d3" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" class="a-cyan"/>
    <circle cx="22" cy="24" r="3" class="a-white"/>
  </g>

  <!-- Frame 5: Pulse 2 [240..288] -->
  <g transform="translate(240, 0)">
    <ellipse cx="24" cy="44" rx="11" ry="3" class="a-shadow"/>
    <path d="M16,8 Q30,22 16,36 Q22,22 16,8 Z" class="a-white"/>
    <line x1="16" y1="8" x2="16" y2="36" stroke="#2ed573" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5.5" class="a-green"/>
    <circle cx="22" cy="22" r="3" class="a-white"/>
  </g>

  <!-- Frame 6: Pulse 3 [288..336] -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="44" rx="10" ry="2.8" class="a-shadow"/>
    <path d="M16,7 Q28,21 16,35 Q22,21 16,7 Z" class="a-silver"/>
    <line x1="16" y1="7" x2="16" y2="35" stroke="#00d2d3" stroke-width="1"/>
    <circle cx="21" cy="21" r="4" class="a-cyan"/>
    <circle cx="21" cy="21" r="2" class="a-white"/>
  </g>

  <!-- Frame 7: Pulse 4 [336..384] -->
  <g transform="translate(336, 0)">
    <ellipse cx="24" cy="43" rx="11" ry="3.2" class="a-shadow"/>
    <path d="M16,9 Q28,23 16,37 Q22,23 16,9 Z" class="a-silver"/>
    <line x1="16" y1="9" x2="16" y2="37" stroke="#00d2d3" stroke-width="1"/>
    <circle cx="21" cy="23" r="3.5" class="a-cyan"/>
    <circle cx="21" cy="23" r="2" class="a-white"/>
  </g>
</svg>
