<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .t-wood   { fill: #451a03; }
      .t-iron   { fill: #292524; }
      .t-gold   { fill: #eab308; }
      .t-lite   { fill: #fde047; }
      .t-glow   { fill: #ffffff; }
      .t-gem    { fill: #00f2fe; }
      .t-shadow { fill: rgba(0,0,0,0.35); }
      .t-beam   { fill: rgba(254, 240, 138, 0.4); }
    </style>
  </defs>

  <!-- Frame 0: Closed Chest [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="t-shadow"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="20" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <rect x="12" y="20" width="3" height="20" class="t-gold"/>
    <rect x="33" y="20" width="3" height="20" class="t-gold"/>
    <path d="M9 20 C9 12, 39 12, 39 20 Z" class="t-wood"/>
    <path d="M12 20 C12 14, 36 14, 36 20 Z" class="t-gold"/>
    <rect x="22" y="19" width="4" height="6" rx="1" class="t-gold"/>
    <circle cx="24" cy="22" r="1.5" class="t-gem"/>
  </g>

  <!-- Frame 1: Closed Chest Pulse [48..96] -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="17" ry="4" class="t-shadow"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="20" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <rect x="12" y="20" width="3" height="20" class="t-gold"/>
    <rect x="33" y="20" width="3" height="20" class="t-gold"/>
    <path d="M9 19 C9 11, 39 11, 39 19 Z" class="t-wood"/>
    <path d="M12 19 C12 13, 36 13, 36 19 Z" class="t-gold"/>
    <rect x="22" y="18" width="4" height="6" rx="1" class="t-gold"/>
    <circle cx="24" cy="21" r="2" class="t-gem"/>
  </g>

  <!-- Frame 2: Closed Chest Hover [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="15" ry="3" class="t-shadow"/>
    <rect x="10" y="21" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="19" width="32" height="4" class="t-gold"/>
    <rect x="10" y="35" width="28" height="4" class="t-gold"/>
    <rect x="12" y="19" width="3" height="20" class="t-gold"/>
    <rect x="33" y="19" width="3" height="20" class="t-gold"/>
    <path d="M9 19 C9 11, 39 11, 39 19 Z" class="t-wood"/>
    <path d="M12 19 C12 13, 36 13, 36 19 Z" class="t-gold"/>
    <rect x="22" y="18" width="4" height="6" rx="1" class="t-gold"/>
    <circle cx="24" cy="21" r="1.5" class="t-gem"/>
  </g>

  <!-- Frame 3: Key Unlocking Glow [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="t-shadow"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="20" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <path d="M9 19 C9 11, 39 11, 39 19 Z" class="t-wood"/>
    <circle cx="24" cy="21" r="3" class="t-lite"/>
    <circle cx="24" cy="21" r="1.5" class="t-glow"/>
  </g>

  <!-- Frame 4: Unlock & Golden Beam Rays [192..240] -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="t-shadow"/>
    <polygon points="24,19 18,2 30,2" class="t-beam"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="20" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <rect x="12" y="20" width="3" height="20" class="t-gold"/>
    <rect x="33" y="20" width="3" height="20" class="t-gold"/>
    <path d="M9 18 C9 10, 39 10, 39 18 Z" class="t-wood"/>
    <path d="M12 18 C12 12, 36 12, 36 18 Z" class="t-gold"/>
    <line x1="10" y1="20" x2="38" y2="20" stroke="#fde047" stroke-width="2"/>
    <circle cx="24" cy="20" r="3" class="t-glow"/>
  </g>

  <!-- Frame 5: Opening Halfway [240..288] -->
  <g transform="translate(240, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="t-shadow"/>
    <polygon points="24,20 10,0 38,0" class="t-beam"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="22" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <path d="M10 22 L14 10 L34 10 L38 22 Z" class="t-wood"/>
    <line x1="14" y1="10" x2="34" y2="10" stroke="#fde047" stroke-width="2"/>
    <ellipse cx="24" cy="22" rx="10" ry="4" class="t-lite"/>
    <circle cx="24" cy="20" r="4" class="t-glow"/>
    <circle cx="16" cy="14" r="1.5" class="t-gem"/>
    <circle cx="32" cy="14" r="1.5" class="t-gem"/>
  </g>

  <!-- Frame 6: Fully Open & Radiating Treasure [288..336] -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="44" rx="17" ry="4" class="t-shadow"/>
    <polygon points="24,20 6,0 42,0" class="t-beam"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="22" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <path d="M10 18 L16 6 L32 6 L38 18 Z" class="t-wood"/>
    <ellipse cx="24" cy="22" rx="12" ry="5" class="t-gold"/>
    <circle cx="20" cy="19" r="2.5" class="t-lite"/>
    <circle cx="28" cy="19" r="2.5" class="t-lite"/>
    <circle cx="24" cy="17" r="2" class="t-gem"/>
    <polygon points="24,11 25,14 28,15 25,16 24,19 23,16 20,15 23,14" class="t-glow"/>
  </g>

  <!-- Frame 7: Shimmering Overflow [336..384] -->
  <g transform="translate(336, 0)">
    <ellipse cx="24" cy="44" rx="17" ry="4" class="t-shadow"/>
    <polygon points="24,20 4,0 44,0" class="t-beam"/>
    <rect x="10" y="22" width="28" height="18" rx="2" class="t-wood"/>
    <rect x="8" y="22" width="32" height="4" class="t-gold"/>
    <rect x="10" y="36" width="28" height="4" class="t-gold"/>
    <path d="M10 18 L16 6 L32 6 L38 18 Z" class="t-wood"/>
    <ellipse cx="24" cy="22" rx="12" ry="5" class="t-gold"/>
    <circle cx="19" cy="19" r="2.5" class="t-lite"/>
    <circle cx="29" cy="19" r="2.5" class="t-lite"/>
    <circle cx="24" cy="16" r="2.2" class="t-glow"/>
    <polygon points="15,16 16,18 18,19 16,20 15,22 14,20 12,19 14,18" class="t-lite"/>
    <polygon points="33,16 34,18 36,19 34,20 33,22 32,20 30,19 32,18" class="t-gem"/>
    <polygon points="24,8 25,12 28,13 25,14 24,17 23,14 20,13 23,12" class="t-glow"/>
  </g>
</svg>
