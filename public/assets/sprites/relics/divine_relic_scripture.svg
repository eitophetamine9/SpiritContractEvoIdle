<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .sc-parchment{ fill: #f5f6fa; }
      .sc-scroll   { fill: #f1c40f; }
      .sc-gold     { fill: #ffd32a; }
      .sc-purple   { fill: #9b59b6; }
      .sc-rune     { fill: #8e44ad; }
      .sc-glow     { fill: #e056fd; }
      .sc-shadow   { fill: rgba(0,0,0,0.3); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="12" ry="3.5" class="sc-shadow"/>
    <!-- Scroll Body -->
    <rect x="14" y="14" width="20" height="22" rx="2" class="sc-parchment"/>
    <!-- Upper & Lower Rollers -->
    <rect x="11" y="12" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="34" width="26" height="4" rx="2" class="sc-gold"/>
    <!-- Central Arcane Seal -->
    <circle cx="24" cy="25" r="4.5" class="sc-purple"/>
    <circle cx="24" cy="25" r="2.5" class="sc-glow"/>
    <!-- Scripture Runes -->
    <line x1="17" y1="18" x2="31" y2="18" stroke="#8e44ad" stroke-width="1"/>
    <line x1="17" y1="31" x2="31" y2="31" stroke="#8e44ad" stroke-width="1"/>
  </g>

  <!-- Frame 1: Idle 2 [48..96] -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="10" ry="3" class="sc-shadow"/>
    <rect x="14" y="12" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="10" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="32" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="23" r="5" class="sc-purple"/>
    <circle cx="24" cy="23" r="3" class="sc-glow"/>
    <line x1="17" y1="16" x2="31" y2="16" stroke="#8e44ad" stroke-width="1"/>
    <line x1="17" y1="29" x2="31" y2="29" stroke="#8e44ad" stroke-width="1"/>
    <circle cx="34" cy="18" r="1.5" class="sc-glow"/>
  </g>

  <!-- Frame 2: Idle 3 [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="9" ry="2.8" class="sc-shadow"/>
    <rect x="14" y="11" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="9" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="31" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="22" r="5.5" class="sc-purple"/>
    <circle cx="24" cy="22" r="3.5" class="sc-glow"/>
    <line x1="17" y1="15" x2="31" y2="15" stroke="#8e44ad" stroke-width="1"/>
    <line x1="17" y1="28" x2="31" y2="28" stroke="#8e44ad" stroke-width="1"/>
    <circle cx="13" cy="18" r="1.5" class="sc-glow"/>
  </g>

  <!-- Frame 3: Idle 4 [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43" rx="11" ry="3.2" class="sc-shadow"/>
    <rect x="14" y="13" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="11" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="33" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="24" r="4.5" class="sc-purple"/>
    <circle cx="24" cy="24" r="2.5" class="sc-glow"/>
    <line x1="17" y1="17" x2="31" y2="17" stroke="#8e44ad" stroke-width="1"/>
    <line x1="17" y1="30" x2="31" y2="30" stroke="#8e44ad" stroke-width="1"/>
  </g>

  <!-- Frame 4: Pulse 1 [192..240] -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="43" rx="12" ry="3.5" class="sc-shadow"/>
    <rect x="14" y="14" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="12" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="34" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="25" r="6" class="sc-glow"/>
    <circle cx="24" cy="25" r="3.5" class="sc-gold"/>
  </g>

  <!-- Frame 5: Pulse 2 [240..288] -->
  <g transform="translate(240, 0)">
    <ellipse cx="24" cy="44" rx="11" ry="3" class="sc-shadow"/>
    <rect x="14" y="13" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="11" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="33" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="24" r="7" class="sc-glow"/>
    <circle cx="24" cy="24" r="4" class="sc-gold"/>
  </g>

  <!-- Frame 6: Pulse 3 [288..336] -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="44" rx="10" ry="2.8" class="sc-shadow"/>
    <rect x="14" y="12" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="10" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="32" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="23" r="5" class="sc-purple"/>
    <circle cx="24" cy="23" r="2.5" class="sc-glow"/>
  </g>

  <!-- Frame 7: Pulse 4 [336..384] -->
  <g transform="translate(336, 0)">
    <ellipse cx="24" cy="43" rx="11" ry="3.2" class="sc-shadow"/>
    <rect x="14" y="13" width="20" height="22" rx="2" class="sc-parchment"/>
    <rect x="11" y="11" width="26" height="4" rx="2" class="sc-gold"/>
    <rect x="11" y="33" width="26" height="4" rx="2" class="sc-gold"/>
    <circle cx="24" cy="24" r="4.5" class="sc-purple"/>
    <circle cx="24" cy="24" r="2.5" class="sc-glow"/>
  </g>
</svg>
