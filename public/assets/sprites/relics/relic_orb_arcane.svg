<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .o-core  { fill: #9b59b6; }
      .o-glow  { fill: #e056fd; }
      .o-light { fill: #ffffff; }
      .o-ring  { stroke: #ffd32a; stroke-width: 1.5; fill: none; }
      .o-ring2 { stroke: #00d2d3; stroke-width: 1.5; fill: none; }
      .o-shadow{ fill: rgba(0,0,0,0.3); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="42" rx="10" ry="3.2" class="o-shadow"/>
    <!-- Outer Rings -->
    <ellipse cx="24" cy="22" rx="16" ry="6" class="o-ring" transform="rotate(-15 24 22)"/>
    <!-- Orb Body -->
    <circle cx="24" cy="22" r="10" class="o-core"/>
    <circle cx="24" cy="22" r="8" class="o-glow"/>
    <circle cx="21" cy="19" r="3" class="o-light"/>
    <!-- Second Ring -->
    <ellipse cx="24" cy="22" rx="14" ry="5" class="o-ring2" transform="rotate(35 24 22)"/>
  </g>

  <!-- Frame 1: Idle 2 [48..96] -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="43" rx="8.5" ry="2.8" class="o-shadow"/>
    <ellipse cx="24" cy="20" rx="16" ry="6" class="o-ring" transform="rotate(-5 24 20)"/>
    <circle cx="24" cy="20" r="10.5" class="o-core"/>
    <circle cx="24" cy="20" r="8.5" class="o-glow"/>
    <circle cx="21" cy="17" r="3.5" class="o-light"/>
    <circle cx="26" cy="22" r="1.5" class="o-light"/>
    <ellipse cx="24" cy="20" rx="14" ry="5" class="o-ring2" transform="rotate(45 24 20)"/>
  </g>

  <!-- Frame 2: Idle 3 [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="43.5" rx="8" ry="2.6" class="o-shadow"/>
    <ellipse cx="24" cy="19" rx="16" ry="6" class="o-ring" transform="rotate(5 24 19)"/>
    <circle cx="24" cy="19" r="11" class="o-core"/>
    <circle cx="24" cy="19" r="9" class="o-glow"/>
    <circle cx="22" cy="16" r="4" class="o-light"/>
    <ellipse cx="24" cy="19" rx="14" ry="5" class="o-ring2" transform="rotate(55 24 19)"/>
  </g>

  <!-- Frame 3: Idle 4 [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="42.5" rx="9" ry="3" class="o-shadow"/>
    <ellipse cx="24" cy="21" rx="16" ry="6" class="o-ring" transform="rotate(-5 24 21)"/>
    <circle cx="24" cy="21" r="10" class="o-core"/>
    <circle cx="24" cy="21" r="8" class="o-glow"/>
    <circle cx="21" cy="18" r="3" class="o-light"/>
    <ellipse cx="24" cy="21" rx="14" ry="5" class="o-ring2" transform="rotate(40 24 21)"/>
  </g>

  <!-- Frame 4: Burst 1 [192..240] -->
  <g transform="translate(192, 0)">
    <circle cx="24" cy="21" r="18" fill="rgba(224,86,253,0.2)"/>
    <circle cx="24" cy="21" r="10" class="o-core"/>
    <circle cx="24" cy="21" r="8" class="o-glow"/>
  </g>

  <!-- Frame 5: Burst 2 [240..288] -->
  <g transform="translate(240, 0)">
    <circle cx="24" cy="20" r="22" fill="rgba(255,255,255,0.3)"/>
    <circle cx="24" cy="20" r="12" class="o-light"/>
  </g>

  <!-- Frame 6: Burst 3 [288..336] -->
  <g transform="translate(288, 0)">
    <circle cx="24" cy="21" r="16" fill="rgba(224,86,253,0.2)"/>
    <circle cx="24" cy="21" r="10" class="o-core"/>
    <circle cx="24" cy="21" r="8" class="o-glow"/>
  </g>

  <!-- Frame 7: Burst 4 [336..384] -->
  <g transform="translate(336, 0)">
    <ellipse cx="24" cy="42" rx="10" ry="3.2" class="o-shadow"/>
    <circle cx="24" cy="22" r="10" class="o-core"/>
    <circle cx="24" cy="22" r="8" class="o-glow"/>
  </g>
</svg>
