<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .pc-gauntlet { fill: #d63031; }
      .pc-claw { fill: #dfe6e9; }
      .pc-gold { fill: #f39c12; }
      .pc-edge { fill: #ffffff; }
      .pc-shadow { fill: rgba(0, 0, 0, 0.35); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="10" ry="3" class="pc-shadow"/>
    <!-- Gauntlet Base -->
    <rect x="15" y="24" width="18" height="15" rx="3" class="pc-gauntlet"/>
    <rect x="18" y="27" width="12" height="4" rx="1" class="pc-gold"/>
    <!-- 3 Primal Talons Curved Forward -->
    <path d="M15 25 Q13 14 18 10 Q18 18 18 25 Z" class="pc-claw"/>
    <path d="M21 24 Q23 10 25 6 Q27 15 27 24 Z" class="pc-claw"/>
    <path d="M30 25 Q34 14 30 10 Q29 18 29 25 Z" class="pc-claw"/>
    <!-- Claw Tips Edge -->
    <polygon points="18,10 17,14 19,14" class="pc-edge"/>
    <polygon points="25,6 24,10 26,10" class="pc-edge"/>
    <polygon points="30,10 29,14 31,14" class="pc-edge"/>
  </g>

  <!-- Frame 1: Idle 2 [48..96] - breathing pulse -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="8" ry="2.5" class="pc-shadow"/>
    <rect x="15" y="22" width="18" height="15" rx="3" class="pc-gauntlet"/>
    <rect x="18" y="25" width="12" height="4" rx="1" class="pc-gold"/>
    <path d="M15 23 Q13 12 18 8 Q18 16 18 23 Z" class="pc-claw"/>
    <path d="M21 22 Q23 8 25 4 Q27 13 27 22 Z" class="pc-claw"/>
    <path d="M30 23 Q34 12 30 8 Q29 16 29 23 Z" class="pc-claw"/>
    <circle cx="25" cy="4" r="1.5" class="pc-edge"/>
  </g>

  <!-- Frame 2: Idle 3 [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="7.5" ry="2.2" class="pc-shadow"/>
    <rect x="15" y="21" width="18" height="15" rx="3" class="pc-gauntlet"/>
    <rect x="18" y="24" width="12" height="4" rx="1" class="pc-gold"/>
    <path d="M15 22 Q12 11 18 7 Q18 15 18 22 Z" class="pc-claw"/>
    <path d="M21 21 Q23 7 25 3 Q27 12 27 21 Z" class="pc-claw"/>
    <path d="M30 22 Q35 11 30 7 Q29 15 29 22 Z" class="pc-claw"/>
    <circle cx="18" cy="7" r="1.5" class="pc-edge"/>
    <circle cx="30" cy="7" r="1.5" class="pc-edge"/>
  </g>

  <!-- Frame 3: Idle 4 [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43.5" rx="9" ry="2.8" class="pc-shadow"/>
    <rect x="15" y="23" width="18" height="15" rx="3" class="pc-gauntlet"/>
    <rect x="18" y="26" width="12" height="4" rx="1" class="pc-gold"/>
    <path d="M15 24 Q13 13 18 9 Q18 17 18 24 Z" class="pc-claw"/>
    <path d="M21 23 Q23 9 25 5 Q27 14 27 23 Z" class="pc-claw"/>
    <path d="M30 24 Q34 13 30 9 Q29 17 29 24 Z" class="pc-claw"/>
  </g>

  <!-- Frame 4: Attack 1 [192..240] - Windup -->
  <g transform="translate(192, 0)">
    <g transform="rotate(-30 24 30)">
      <rect x="15" y="24" width="18" height="15" rx="3" class="pc-gauntlet"/>
      <path d="M15 25 Q13 14 18 10 Q18 18 18 25 Z" class="pc-claw"/>
      <path d="M21 24 Q23 10 25 6 Q27 15 27 24 Z" class="pc-claw"/>
      <path d="M30 25 Q34 14 30 10 Q29 18 29 25 Z" class="pc-claw"/>
    </g>
  </g>

  <!-- Frame 5: Attack 2 [240..288] - Triple Claw Slash Trails -->
  <g transform="translate(240, 0)">
    <path d="M10 8 Q24 16 38 22" stroke="#ff7675" stroke-width="2.5" fill="none"/>
    <path d="M8 16 Q24 24 40 30" stroke="#d63031" stroke-width="3" fill="none"/>
    <path d="M12 24 Q26 32 38 40" stroke="#ff7675" stroke-width="2.5" fill="none"/>
    <g transform="rotate(40 24 25)">
      <rect x="15" y="20" width="18" height="15" rx="3" class="pc-gauntlet"/>
      <path d="M21 20 Q23 6 25 2 Q27 11 27 20 Z" fill="#fff"/>
    </g>
  </g>

  <!-- Frame 6: Attack 3 [288..336] - Slash Follow-Through -->
  <g transform="translate(288, 0)">
    <path d="M26 22 Q38 30 44 42" stroke="#d63031" stroke-width="2" fill="none"/>
    <rect x="15" y="24" width="18" height="15" rx="3" class="pc-gauntlet"/>
    <path d="M21 24 Q23 10 25 6 Q27 15 27 24 Z" class="pc-claw"/>
  </g>

  <!-- Frame 7: Hurt / Flash [336..384] -->
  <g transform="translate(336, 0)">
    <rect x="15" y="24" width="18" height="15" rx="3" fill="#ffffff"/>
    <circle cx="24" cy="20" r="8" fill="rgba(255, 118, 117, 0.6)"/>
  </g>
</svg>
