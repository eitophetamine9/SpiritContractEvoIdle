<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .as-shaft { fill: #6c5ce7; }
      .as-gold { fill: #f1c40f; }
      .as-gem { fill: #e056fd; }
      .as-orb { fill: #be2edd; }
      .as-glow { fill: rgba(224, 86, 253, 0.45); }
      .as-shadow { fill: rgba(0, 0, 0, 0.35); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="8" ry="2.8" class="as-shadow"/>
    <!-- Staff Shaft -->
    <rect x="23" y="16" width="3" height="26" rx="1.5" class="as-shaft"/>
    <circle cx="24.5" cy="42" r="2" class="as-gold"/>
    <!-- Headpiece Crest -->
    <path d="M17 14 Q24.5 19 32 14 Q24.5 10 17 14 Z" class="as-gold"/>
    <!-- Floating Arcane Gem -->
    <circle cx="24.5" cy="9" r="6" class="as-glow"/>
    <polygon points="24.5,4 29,9 24.5,14 20,9" class="as-gem"/>
    <!-- Orbiting satellite particle -->
    <circle cx="15" cy="9" r="1.5" class="as-gold"/>
  </g>

  <!-- Frame 1: Idle 2 [48..96] - floating higher & rotating orb -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="7" ry="2.3" class="as-shadow"/>
    <rect x="23" y="14" width="3" height="26" rx="1.5" class="as-shaft"/>
    <circle cx="24.5" cy="40" r="2" class="as-gold"/>
    <path d="M17 12 Q24.5 17 32 12 Q24.5 8 17 12 Z" class="as-gold"/>
    <circle cx="24.5" cy="7" r="7" class="as-glow"/>
    <polygon points="24.5,2 29.5,7 24.5,12 19.5,7" class="as-gem"/>
    <circle cx="24.5" cy="0" r="1.5" class="as-gold"/>
  </g>

  <!-- Frame 2: Idle 3 [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="6" ry="2.1" class="as-shadow"/>
    <rect x="23" y="13" width="3" height="26" rx="1.5" class="as-shaft"/>
    <circle cx="24.5" cy="39" r="2" class="as-gold"/>
    <path d="M17 11 Q24.5 16 32 11 Q24.5 7 17 11 Z" class="as-gold"/>
    <circle cx="24.5" cy="6" r="8" class="as-glow"/>
    <polygon points="24.5,1 30,6 24.5,11 19,6" class="as-gem"/>
    <circle cx="34" cy="6" r="1.5" class="as-gold"/>
  </g>

  <!-- Frame 3: Idle 4 [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43.5" rx="7.5" ry="2.5" class="as-shadow"/>
    <rect x="23" y="15" width="3" height="26" rx="1.5" class="as-shaft"/>
    <circle cx="24.5" cy="41" r="2" class="as-gold"/>
    <path d="M17 13 Q24.5 18 32 13 Q24.5 9 17 13 Z" class="as-gold"/>
    <circle cx="24.5" cy="8" r="6.5" class="as-glow"/>
    <polygon points="24.5,3 29,8 24.5,13 20,8" class="as-gem"/>
    <circle cx="24.5" cy="15" r="1.5" class="as-gold"/>
  </g>

  <!-- Frame 4: Attack 1 [192..240] - Channeling Charge -->
  <g transform="translate(192, 0)">
    <rect x="23" y="15" width="3" height="26" rx="1.5" class="as-shaft"/>
    <path d="M17 13 Q24.5 18 32 13 Q24.5 9 17 13 Z" class="as-gold"/>
    <!-- Expanding Arcane Nova -->
    <circle cx="24.5" cy="8" r="10" fill="rgba(224, 86, 253, 0.6)"/>
    <polygon points="24.5,1 31,8 24.5,15 18,8" fill="#ffffff"/>
  </g>

  <!-- Frame 5: Attack 2 [240..288] - Spell Burst Beam -->
  <g transform="translate(240, 0)">
    <!-- Forward tilted cast -->
    <g transform="rotate(35 24 35)">
      <rect x="23" y="15" width="3" height="26" rx="1.5" class="as-shaft"/>
      <path d="M17 13 Q24.5 18 32 13 Q24.5 9 17 13 Z" class="as-gold"/>
    </g>
    <!-- Radiant Starburst -->
    <circle cx="36" cy="12" r="8" fill="#e056fd"/>
    <circle cx="36" cy="12" r="4" fill="#ffffff"/>
    <line x1="28" y1="12" x2="46" y2="12" stroke="#ffffff" stroke-width="2"/>
    <line x1="36" y1="4" x2="36" y2="20" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Frame 6: Attack 3 [288..336] - Dispersal -->
  <g transform="translate(288, 0)">
    <rect x="23" y="16" width="3" height="26" rx="1.5" class="as-shaft"/>
    <circle cx="24.5" cy="9" r="6" class="as-glow"/>
    <polygon points="24.5,4 29,9 24.5,14 20,9" class="as-gem"/>
    <circle cx="38" cy="8" r="1.5" fill="#f1c40f"/>
    <circle cx="42" cy="14" r="2" fill="#e056fd"/>
  </g>

  <!-- Frame 7: Hurt / Flash [336..384] -->
  <g transform="translate(336, 0)">
    <rect x="23" y="16" width="3" height="26" rx="1.5" fill="#ffffff"/>
    <circle cx="24.5" cy="9" r="9" fill="rgba(255, 255, 255, 0.8)"/>
  </g>
</svg>
