<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .cb-limb { fill: #0984e3; }
      .cb-gold { fill: #fdcb6e; }
      .cb-string { stroke: #dfe6e9; stroke-width: 1.2; }
      .cb-arrow { fill: #74b9ff; }
      .cb-spark { fill: #ffffff; }
      .cb-shadow { fill: rgba(0, 0, 0, 0.35); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="9" ry="3" class="cb-shadow"/>
    <!-- Bow Limbs Arc -->
    <path d="M16 8 Q30 24 16 40 Q26 24 16 8 Z" class="cb-limb"/>
    <!-- Gold Accents on Tips and Riser -->
    <circle cx="16" cy="8" r="2.5" class="cb-gold"/>
    <circle cx="16" cy="40" r="2.5" class="cb-gold"/>
    <rect x="23" y="21" width="3" height="6" rx="1" class="cb-gold"/>
    <!-- Bowstring -->
    <line x1="16" y1="8" x2="16" y2="40" class="cb-string"/>
  </g>

  <!-- Frame 1: Idle 2 [48..96] - floating higher & slight string shimmer -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="7" ry="2.4" class="cb-shadow"/>
    <path d="M16 6 Q30 22 16 38 Q26 22 16 6 Z" class="cb-limb"/>
    <circle cx="16" cy="6" r="2.5" class="cb-gold"/>
    <circle cx="16" cy="38" r="2.5" class="cb-gold"/>
    <rect x="23" y="19" width="3" height="6" rx="1" class="cb-gold"/>
    <line x1="16" y1="6" x2="16" y2="38" class="cb-string"/>
    <circle cx="28" cy="18" r="1.5" class="cb-spark"/>
  </g>

  <!-- Frame 2: Idle 3 [96..144] - celestial sparkle peak -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="6.5" ry="2.2" class="cb-shadow"/>
    <path d="M16 5 Q30 21 16 37 Q26 21 16 5 Z" class="cb-limb"/>
    <circle cx="16" cy="5" r="2.5" class="cb-gold"/>
    <circle cx="16" cy="37" r="2.5" class="cb-gold"/>
    <rect x="23" y="18" width="3" height="6" rx="1" class="cb-gold"/>
    <line x1="16" y1="5" x2="16" y2="37" class="cb-string"/>
    <circle cx="20" cy="12" r="1.5" class="cb-spark"/>
    <circle cx="31" cy="28" r="1.5" class="cb-gold"/>
  </g>

  <!-- Frame 3: Idle 4 [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43.5" rx="8" ry="2.7" class="cb-shadow"/>
    <path d="M16 7 Q30 23 16 39 Q26 23 16 7 Z" class="cb-limb"/>
    <circle cx="16" cy="7" r="2.5" class="cb-gold"/>
    <circle cx="16" cy="39" r="2.5" class="cb-gold"/>
    <rect x="23" y="20" width="3" height="6" rx="1" class="cb-gold"/>
    <line x1="16" y1="7" x2="16" y2="39" class="cb-string"/>
  </g>

  <!-- Frame 4: Attack 1 [192..240] - Drawn Arrow -->
  <g transform="translate(192, 0)">
    <path d="M14 7 Q32 23 14 39 Q28 23 14 7 Z" class="cb-limb"/>
    <!-- Drawn string -->
    <polyline points="14,7 28,23 14,39" fill="none" stroke="#dfe6e9" stroke-width="1.2"/>
    <!-- Energy Arrow Nocked -->
    <line x1="8" y1="23" x2="36" y2="23" stroke="#74b9ff" stroke-width="2"/>
    <polygon points="38,23 33,20 33,26" fill="#fdcb6e"/>
  </g>

  <!-- Frame 5: Attack 2 [240..288] - Release / Arrow Flight -->
  <g transform="translate(240, 0)">
    <path d="M16 8 Q29 24 16 40 Q25 24 16 8 Z" class="cb-limb"/>
    <line x1="16" y1="8" x2="16" y2="40" class="cb-string"/>
    <!-- Released Astral Arrow Trail -->
    <line x1="24" y1="24" x2="44" y2="24" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="46,24 40,20 40,28" fill="#74b9ff"/>
    <circle cx="34" cy="24" r="3" fill="rgba(116, 185, 255, 0.5)"/>
  </g>

  <!-- Frame 6: Attack 3 [288..336] - String Vibrating Rest -->
  <g transform="translate(288, 0)">
    <path d="M16 8 Q30 24 16 40 Q26 24 16 8 Z" class="cb-limb"/>
    <path d="M16 8 Q19 24 16 40" stroke="#74b9ff" stroke-width="1.2" fill="none"/>
    <circle cx="42" cy="24" r="2" class="cb-spark"/>
  </g>

  <!-- Frame 7: Hurt / Flash [336..384] -->
  <g transform="translate(336, 0)">
    <path d="M16 8 Q30 24 16 40 Q26 24 16 8 Z" fill="#ffffff"/>
    <line x1="16" y1="8" x2="16" y2="40" stroke="#fdcb6e" stroke-width="2"/>
    <circle cx="24" cy="24" r="5" fill="rgba(253, 203, 110, 0.6)"/>
  </g>
</svg>
