<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-gold  { fill: #f59e0b; }
      .c-lite  { fill: #fde047; }
      .c-dark  { fill: #b45309; }
      .c-cyan  { fill: #06b6d4; }
      .c-ring  { fill: none; stroke: #38bdf8; stroke-width: 1.5; stroke-dasharray: 2 1; }
      .c-eye   { fill: #0284c7; }
      .c-hurt  { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <!-- Tail -->
    <path d="M12 28 C8 32, 4 28, 4 22 C6 24, 10 26, 14 26 Z" class="c-dark"/>
    <!-- Body -->
    <ellipse cx="22" cy="26" rx="9" ry="7" class="c-gold"/>
    <!-- Underbelly -->
    <ellipse cx="23" cy="28" rx="6" ry="4" class="c-lite"/>
    <!-- Wings -->
    <polygon points="18,22 14,8 24,16" class="c-dark"/>
    <polygon points="19,23 23,10 27,18" class="c-gold"/>
    <!-- Head -->
    <polygon points="26,22 34,16 38,20 30,26" class="c-gold"/>
    <polygon points="30,19 36,13 34,18" class="c-dark"/>
    <circle cx="33" cy="19" r="1.5" class="c-eye"/>
    <!-- Chrono Dial Ring -->
    <ellipse cx="24" cy="24" rx="14" ry="14" class="c-ring"/>
    <circle cx="24" cy="10" r="1.5" class="c-cyan"/>
  </g>

  <!-- Frame 1: Idle 2 (Flap & Rotate Dial) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="43" rx="14" ry="3.5" fill="rgba(0,0,0,0.3)"/>
    <path d="M12 27 C8 31, 4 27, 4 21 C6 23, 10 25, 14 25 Z" class="c-dark"/>
    <ellipse cx="22" cy="24" rx="9" ry="7" class="c-gold"/>
    <ellipse cx="23" cy="26" rx="6" ry="4" class="c-lite"/>
    <polygon points="18,20 12,6 24,14" class="c-dark"/>
    <polygon points="19,21 21,7 27,16" class="c-gold"/>
    <polygon points="26,20 34,14 38,18 30,24" class="c-gold"/>
    <circle cx="33" cy="17" r="1.5" class="c-eye"/>
    <ellipse cx="24" cy="22" rx="14" ry="14" class="c-ring" transform="rotate(30, 24, 22)"/>
    <circle cx="31" cy="10" r="1.5" class="c-cyan"/>
  </g>

  <!-- Frame 2: Idle 3 (Downstroke) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="43" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <path d="M12 29 C8 33, 4 29, 4 23 C6 25, 10 27, 14 27 Z" class="c-dark"/>
    <ellipse cx="22" cy="27" rx="9" ry="7" class="c-gold"/>
    <polygon points="18,23 16,14 24,20" class="c-dark"/>
    <polygon points="19,24 25,16 27,22" class="c-gold"/>
    <polygon points="26,23 34,17 38,21 30,27" class="c-gold"/>
    <circle cx="33" cy="20" r="1.5" class="c-eye"/>
    <ellipse cx="24" cy="25" rx="14" ry="14" class="c-ring" transform="rotate(60, 24, 25)"/>
    <circle cx="36" cy="17" r="1.5" class="c-cyan"/>
  </g>

  <!-- Frame 3: Idle 4 (Chrono Pulse) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43" rx="15" ry="3.5" fill="rgba(0,0,0,0.3)"/>
    <path d="M12 28 C8 32, 4 28, 4 22 C6 24, 10 26, 14 26 Z" class="c-dark"/>
    <ellipse cx="22" cy="25" rx="9" ry="7" class="c-gold"/>
    <polygon points="18,21 14,7 24,15" class="c-dark"/>
    <polygon points="19,22 23,9 27,17" class="c-gold"/>
    <polygon points="26,21 34,15 38,19 30,25" class="c-gold"/>
    <circle cx="33" cy="18" r="2" class="c-cyan"/>
    <ellipse cx="24" cy="24" rx="16" ry="16" class="c-ring"/>
    <circle cx="24" cy="8" r="2" class="c-lite"/>
  </g>

  <!-- Frame 4: Attack 1 (Time Compression) -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="43" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="20" cy="26" rx="8" ry="6" class="c-gold"/>
    <polygon points="16,22 10,10 22,18" class="c-dark"/>
    <polygon points="24,22 30,18 34,22 28,26" class="c-gold"/>
    <!-- Compressed time sphere in jaws -->
    <circle cx="36" cy="22" r="3.5" class="c-cyan"/>
  </g>

  <!-- Frame 5: Attack 2 (Temporal Beam Blast) -->
  <g transform="translate(240, 0)">
    <ellipse cx="24" cy="43" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    <ellipse cx="18" cy="25" rx="8" ry="6" class="c-gold"/>
    <polygon points="22,20 30,16 34,20 26,24" class="c-gold"/>
    <!-- Beam of light -->
    <polygon points="34,18 48,12 48,26 34,22" class="c-cyan"/>
    <line x1="34" y1="20" x2="48" y2="19" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- Frame 6: Attack 3 (Recoil) -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="43" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="20" cy="26" rx="8" ry="6" class="c-gold"/>
    <polygon points="24,22 32,18 36,22 28,26" class="c-gold"/>
    <circle cx="24" cy="24" r="14" class="c-ring"/>
  </g>

  <!-- Frame 7: Hurt -->
  <g transform="translate(336, 0)">
    <ellipse cx="20" cy="43" rx="12" ry="3" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="18" cy="27" rx="8" ry="6" class="c-hurt"/>
    <polygon points="22,23 28,19 32,23 24,27" class="c-dark"/>
    <circle cx="27" cy="21" r="1.5" fill="#fff"/>
  </g>
</svg>
