<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .id-crust { fill: #1c1917; }
      .id-lava  { fill: #ea580c; }
      .id-fire  { fill: #f97316; }
      .id-flame { fill: #facc15; }
      .id-horn  { fill: #7c2d12; }
      .id-eye   { fill: #fef08a; }
      .id-shadow{ fill: rgba(0,0,0,0.4); }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 [0..48] -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="id-shadow"/>
    <!-- Horns -->
    <polygon points="14,14 6,4 16,10" class="id-horn"/>
    <polygon points="34,14 42,4 32,10" class="id-horn"/>
    <!-- Molten Body -->
    <rect x="14" y="18" width="20" height="20" rx="3" class="id-crust"/>
    <polygon points="18,22 24,30 30,22 24,26" class="id-lava"/>
    <circle cx="24" cy="27" r="3.5" class="id-flame"/>
    <!-- Head -->
    <rect x="16" y="10" width="16" height="12" rx="2" class="id-crust"/>
    <!-- Glowing Lava Eyes -->
    <rect x="18" y="14" width="4" height="3" class="id-eye"/>
    <rect x="26" y="14" width="4" height="3" class="id-eye"/>
    <!-- Fire Spikes on Back -->
    <polygon points="12,18 8,14 14,16" class="id-fire"/>
    <polygon points="36,18 40,14 34,16" class="id-fire"/>
    <!-- Claws -->
    <rect x="14" y="38" width="6" height="5" rx="1" class="id-crust"/>
    <rect x="28" y="38" width="6" height="5" rx="1" class="id-crust"/>
  </g>

  <!-- Frame 1: Idle 2 (Breathe Down / Glow) [48..96] -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="17" ry="4" class="id-shadow"/>
    <polygon points="14,15 6,5 16,11" class="id-horn"/>
    <polygon points="34,15 42,5 32,11" class="id-horn"/>
    <rect x="13" y="19" width="22" height="19" rx="3" class="id-crust"/>
    <polygon points="17,23 24,31 31,23 24,27" class="id-lava"/>
    <circle cx="24" cy="28" r="4.5" class="id-flame"/>
    <rect x="16" y="11" width="16" height="12" rx="2" class="id-crust"/>
    <rect x="18" y="15" width="4" height="3" class="id-eye"/>
    <rect x="26" y="15" width="4" height="3" class="id-eye"/>
    <polygon points="11,19 7,15 13,17" class="id-fire"/>
    <polygon points="37,19 41,15 35,17" class="id-fire"/>
    <rect x="13" y="38" width="7" height="5" rx="1" class="id-crust"/>
    <rect x="28" y="38" width="7" height="5" rx="1" class="id-crust"/>
  </g>

  <!-- Frame 2: Idle 3 (Rise / Flare) [96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="15" ry="3.2" class="id-shadow"/>
    <polygon points="14,13 6,3 16,9" class="id-horn"/>
    <polygon points="34,13 42,3 32,9" class="id-horn"/>
    <rect x="14" y="17" width="20" height="21" rx="3" class="id-crust"/>
    <polygon points="18,21 24,29 30,21 24,25" class="id-lava"/>
    <circle cx="24" cy="26" r="4" class="id-flame"/>
    <rect x="16" y="9" width="16" height="12" rx="2" class="id-crust"/>
    <rect x="18" y="13" width="4" height="3" class="id-eye"/>
    <rect x="26" y="13" width="4" height="3" class="id-eye"/>
    <polygon points="12,17 8,13 14,15" class="id-fire"/>
    <polygon points="36,17 40,13 34,15" class="id-fire"/>
    <rect x="14" y="38" width="6" height="5" rx="1" class="id-crust"/>
    <rect x="28" y="38" width="6" height="5" rx="1" class="id-crust"/>
  </g>

  <!-- Frame 3: Idle 4 (Settle) [144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="id-shadow"/>
    <polygon points="14,14 6,4 16,10" class="id-horn"/>
    <polygon points="34,14 42,4 32,10" class="id-horn"/>
    <rect x="14" y="18" width="20" height="20" rx="3" class="id-crust"/>
    <polygon points="18,22 24,30 30,22 24,26" class="id-lava"/>
    <circle cx="24" cy="27" r="3.5" class="id-flame"/>
    <rect x="16" y="10" width="16" height="12" rx="2" class="id-crust"/>
    <rect x="18" y="14" width="4" height="3" class="id-eye"/>
    <rect x="26" y="14" width="4" height="3" class="id-eye"/>
    <polygon points="12,18 8,14 14,16" class="id-fire"/>
    <polygon points="36,18 40,14 34,16" class="id-fire"/>
    <rect x="14" y="38" width="6" height="5" rx="1" class="id-crust"/>
    <rect x="28" y="38" width="6" height="5" rx="1" class="id-crust"/>
  </g>

  <!-- Frame 4: Attack Windup [192..240] -->
  <g transform="translate(192, 0)">
    <ellipse cx="22" cy="44" rx="16" ry="3.5" class="id-shadow"/>
    <rect x="12" y="18" width="20" height="20" rx="3" class="id-crust"/>
    <rect x="14" y="10" width="16" height="12" rx="2" class="id-crust"/>
    <!-- Raising magma fist back -->
    <circle cx="38" cy="14" r="7" class="id-lava"/>
    <circle cx="38" cy="14" r="4" class="id-flame"/>
  </g>

  <!-- Frame 5: Attack Magma Slam [240..288] -->
  <g transform="translate(240, 0)">
    <ellipse cx="26" cy="44" rx="19" ry="4.5" class="id-shadow"/>
    <rect x="16" y="19" width="22" height="19" rx="3" class="id-crust"/>
    <rect x="18" y="11" width="16" height="12" rx="2" class="id-crust"/>
    <!-- Magma explosion shockwave on front -->
    <circle cx="10" cy="38" r="9" class="id-lava"/>
    <circle cx="10" cy="38" r="5" class="id-flame"/>
    <path d="M2 32 L10 24 L14 36 L6 42 Z" class="id-fire"/>
  </g>

  <!-- Frame 6: Attack Recovery [288..336] -->
  <g transform="translate(288, 0)">
    <ellipse cx="25" cy="44" rx="16" ry="3.5" class="id-shadow"/>
    <rect x="15" y="18" width="20" height="20" rx="3" class="id-crust"/>
    <rect x="17" y="10" width="16" height="12" rx="2" class="id-crust"/>
    <circle cx="14" cy="36" r="5" class="id-lava"/>
    <circle cx="14" cy="36" r="2.5" class="id-flame"/>
  </g>

  <!-- Frame 7: Hurt / Recoil [336..384] -->
  <g transform="translate(336, 0)">
    <ellipse cx="21" cy="44" rx="13" ry="3" class="id-shadow"/>
    <rect x="11" y="20" width="20" height="18" rx="3" fill="#ef4444"/>
    <rect x="13" y="12" width="16" height="12" rx="2" fill="#dc2626"/>
    <rect x="15" y="16" width="4" height="2" fill="#fca5a5"/>
    <rect x="23" y="16" width="4" height="2" fill="#fca5a5"/>
  </g>
</svg>
