<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .s-armor { fill: #f1f5f9; }
      .s-gold  { fill: #fbbf24; }
      .s-wing1 { fill: #e0f2fe; }
      .s-wing2 { fill: #bae6fd; }
      .s-halo  { fill: none; stroke: #fde047; stroke-width: 1.5; }
      .s-shield{ fill: #38bdf8; stroke: #f59e0b; stroke-width: 1; }
      .s-eye   { fill: #0284c7; }
      .s-hurt  { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="44" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <!-- Halo -->
    <ellipse cx="24" cy="9" rx="7" ry="2.5" class="s-halo"/>
    <!-- Upper Wings -->
    <path d="M20 18 C12 8, 4 10, 2 20 C10 16, 16 18, 20 22 Z" class="s-wing1"/>
    <path d="M28 18 C36 8, 44 10, 46 20 C38 16, 32 18, 28 22 Z" class="s-wing1"/>
    <!-- Lower Wings -->
    <path d="M20 22 C14 22, 6 26, 6 34 C12 30, 16 28, 20 26 Z" class="s-wing2"/>
    <path d="M28 22 C34 22, 42 26, 42 34 C36 30, 32 28, 28 26 Z" class="s-wing2"/>
    <!-- Robe / Plate Armor -->
    <path d="M18 42 L24 24 L30 42 Z" class="s-armor"/>
    <!-- Chestplate & Pauldrons -->
    <rect x="20" y="20" width="8" height="8" rx="2" class="s-gold"/>
    <polygon points="18,20 21,18 21,24" class="s-armor"/>
    <polygon points="30,20 27,18 27,24" class="s-armor"/>
    <!-- Helm / Head -->
    <polygon points="24,12 20,18 28,18" class="s-armor"/>
    <circle cx="24" cy="16" r="1.5" class="s-eye"/>
    <!-- Divine Aegis Shield in Hand -->
    <polygon points="14,24 18,26 18,34 14,38 10,34 10,26" class="s-shield"/>
  </g>

  <!-- Frame 1: Idle 2 (Hover Up) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="14" ry="3.5" fill="rgba(0,0,0,0.3)"/>
    <ellipse cx="24" cy="8" rx="7" ry="2.5" class="s-halo"/>
    <path d="M20 17 C12 7, 4 9, 2 19 C10 15, 16 17, 20 21 Z" class="s-wing1"/>
    <path d="M28 17 C36 7, 44 9, 46 19 C38 15, 32 17, 28 21 Z" class="s-wing1"/>
    <path d="M20 21 C14 21, 6 25, 6 33 C12 29, 16 27, 20 25 Z" class="s-wing2"/>
    <path d="M28 21 C34 21, 42 25, 42 33 C36 29, 32 27, 28 25 Z" class="s-wing2"/>
    <path d="M18 41 L24 23 L30 41 Z" class="s-armor"/>
    <rect x="20" y="19" width="8" height="8" rx="2" class="s-gold"/>
    <polygon points="24,11 20,17 28,17" class="s-armor"/>
    <circle cx="24" cy="15" r="1.5" class="s-eye"/>
    <polygon points="14,23 18,25 18,33 14,37 10,33 10,25" class="s-shield"/>
  </g>

  <!-- Frame 2: Idle 3 (Hover Down) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <ellipse cx="24" cy="10" rx="7" ry="2.5" class="s-halo"/>
    <path d="M20 19 C12 9, 4 11, 2 21 C10 17, 16 19, 20 23 Z" class="s-wing1"/>
    <path d="M28 19 C36 9, 44 11, 46 21 C38 17, 32 19, 28 23 Z" class="s-wing1"/>
    <path d="M18 43 L24 25 L30 43 Z" class="s-armor"/>
    <rect x="20" y="21" width="8" height="8" rx="2" class="s-gold"/>
    <polygon points="24,13 20,19 28,19" class="s-armor"/>
    <circle cx="24" cy="17" r="1.5" class="s-eye"/>
    <polygon points="14,25 18,27 18,35 14,39 10,35 10,27" class="s-shield"/>
  </g>

  <!-- Frame 3: Idle 4 (Divine Radiance) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="44" rx="15" ry="3.5" fill="rgba(0,0,0,0.3)"/>
    <ellipse cx="24" cy="9" rx="8" ry="3" class="s-halo"/>
    <path d="M20 18 C12 6, 2 8, 0 18 C8 16, 16 18, 20 22 Z" class="s-wing1"/>
    <path d="M28 18 C36 6, 46 8, 48 18 C40 16, 32 18, 28 22 Z" class="s-wing1"/>
    <path d="M18 42 L24 24 L30 42 Z" class="s-armor"/>
    <rect x="20" y="20" width="8" height="8" rx="2" class="s-gold"/>
    <polygon points="24,12 20,18 28,18" class="s-armor"/>
    <circle cx="24" cy="16" r="2" class="s-gold"/>
    <polygon points="14,24 18,26 18,34 14,38 10,34 10,26" class="s-shield"/>
  </g>

  <!-- Frame 4: Attack 1 (Shield Charge Raise) -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="44" rx="14" ry="3" fill="rgba(0,0,0,0.25)"/>
    <path d="M16 42 L22 24 L28 42 Z" class="s-armor"/>
    <polygon points="22,12 18,18 26,18" class="s-armor"/>
    <polygon points="18,22 26,20 28,32 18,36 12,32 12,24" class="s-shield"/>
  </g>

  <!-- Frame 5: Attack 2 (Aegis Holy Slam) -->
  <g transform="translate(240, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    <path d="M14 42 L20 24 L26 42 Z" class="s-armor"/>
    <polygon points="20,12 16,18 24,18" class="s-armor"/>
    <polygon points="24,20 34,18 36,34 26,40 18,34 18,22" class="s-shield"/>
    <!-- Holy shockwave -->
    <path d="M36 12 L44 24 L38 36 Z" class="s-gold"/>
  </g>

  <!-- Frame 6: Attack 3 (Recovery) -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="44" rx="13" ry="3" fill="rgba(0,0,0,0.25)"/>
    <path d="M18 42 L24 24 L30 42 Z" class="s-armor"/>
    <polygon points="14,24 18,26 18,34 14,38 10,34 10,26" class="s-shield"/>
  </g>

  <!-- Frame 7: Hurt -->
  <g transform="translate(336, 0)">
    <ellipse cx="20" cy="44" rx="12" ry="3" fill="rgba(0,0,0,0.25)"/>
    <path d="M14 42 L20 26 L26 42 Z" class="s-hurt"/>
    <polygon points="20,14 16,20 24,20" class="s-armor"/>
    <circle cx="20" cy="18" r="1.5" fill="#fff"/>
  </g>
</svg>
