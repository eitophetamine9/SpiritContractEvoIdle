<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .b-fire { fill: #ef4444; }
      .b-gold { fill: #f59e0b; }
      .b-flame{ fill: #fbbf24; }
      .b-dark { fill: #7f1d1d; }
      .b-eye  { fill: #ffffff; }
      .b-hurt { fill: #991b1b; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Hover Flap Down) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="42" rx="12" ry="3.5" fill="rgba(0,0,0,0.25)"/>
    <!-- Tail Flames -->
    <polygon points="12,26 6,32 10,22" class="b-gold"/>
    <polygon points="10,28 3,36 8,24" class="b-flame"/>
    <!-- Body -->
    <rect x="15" y="16" width="18" height="15" rx="3" class="b-fire"/>
    <rect x="18" y="18" width="12" height="11" class="b-gold"/>
    <!-- Wings Down -->
    <path d="M12 24 L4 32 L16 28 Z" class="b-fire"/>
    <path d="M26 24 L34 32 L22 28 Z" class="b-fire"/>
    <!-- Head & Crest -->
    <rect x="22" y="8" width="12" height="11" rx="2" class="b-fire"/>
    <polygon points="26,8 28,1 31,8" class="b-flame"/>
    <polygon points="24,8 25,3 27,8" class="b-gold"/>
    <!-- Beak -->
    <polygon points="34,12 40,15 34,17" class="b-gold"/>
    <rect x="27" y="11" width="3" height="3" class="b-eye"/>
  </g>

  <!-- Frame 1: Idle 2 (Hover Flap Mid) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="42" rx="11" ry="3" fill="rgba(0,0,0,0.22)"/>
    <polygon points="12,24 5,30 10,20" class="b-gold"/>
    <polygon points="10,26 2,34 8,22" class="b-flame"/>
    <rect x="15" y="14" width="18" height="15" rx="3" class="b-fire"/>
    <rect x="18" y="16" width="12" height="11" class="b-gold"/>
    <!-- Wings Mid -->
    <path d="M12 20 L2 20 L16 24 Z" class="b-fire"/>
    <path d="M26 20 L36 20 L22 24 Z" class="b-fire"/>
    <rect x="22" y="6" width="12" height="11" rx="2" class="b-fire"/>
    <polygon points="26,6 28,0 31,6" class="b-flame"/>
    <polygon points="34,10 40,13 34,15" class="b-gold"/>
    <rect x="27" y="9" width="3" height="3" class="b-eye"/>
  </g>

  <!-- Frame 2: Idle 3 (Hover Flap Up) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="42" rx="10" ry="2.5" fill="rgba(0,0,0,0.2)"/>
    <polygon points="12,23 6,28 10,19" class="b-gold"/>
    <polygon points="10,25 3,32 8,21" class="b-flame"/>
    <rect x="15" y="13" width="18" height="15" rx="3" class="b-fire"/>
    <rect x="18" y="15" width="12" height="11" class="b-gold"/>
    <!-- Wings Up -->
    <path d="M14 18 L6 6 L18 20 Z" class="b-flame"/>
    <path d="M24 18 L32 6 L20 20 Z" class="b-flame"/>
    <rect x="22" y="5" width="12" height="11" rx="2" class="b-fire"/>
    <polygon points="26,5 28,0 31,5" class="b-flame"/>
    <polygon points="34,9 40,12 34,14" class="b-gold"/>
    <rect x="27" y="8" width="3" height="3" class="b-eye"/>
  </g>

  <!-- Frame 3: Idle 4 (Hover Crest Flare) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="42" rx="12" ry="3.5" fill="rgba(0,0,0,0.25)"/>
    <polygon points="12,25 5,31 10,21" class="b-gold"/>
    <polygon points="10,27 2,35 8,23" class="b-flame"/>
    <rect x="15" y="15" width="18" height="15" rx="3" class="b-fire"/>
    <rect x="18" y="17" width="12" height="11" class="b-gold"/>
    <path d="M12 22 L3 26 L16 26 Z" class="b-fire"/>
    <path d="M26 22 L35 26 L22 26 Z" class="b-fire"/>
    <rect x="22" y="7" width="12" height="11" rx="2" class="b-fire"/>
    <polygon points="26,7 28,1 31,7" class="b-flame"/>
    <polygon points="34,11 40,14 34,16" class="b-gold"/>
    <rect x="27" y="10" width="3" height="3" class="b-eye"/>
  </g>

  <!-- Frame 4: Attack Windup (Flare Dive) -->
  <g transform="translate(192, 0)">
    <ellipse cx="20" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="12" y="18" width="16" height="14" rx="3" class="b-dark"/>
    <path d="M8 12 L0 6 L14 16 Z" class="b-flame"/>
    <rect x="18" y="12" width="12" height="11" rx="2" class="b-fire"/>
    <polygon points="30,15 36,18 30,20" class="b-gold"/>
  </g>

  <!-- Frame 5: Attack Strike (Fireball Torrent) -->
  <g transform="translate(240, 0)">
    <ellipse cx="28" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="18" y="14" width="18" height="14" rx="3" class="b-fire"/>
    <!-- Fire Jet -->
    <path d="M34 18 Q44 14 48 24 Q40 28 34 22 Z" fill="#f59e0b"/>
    <circle cx="42" cy="20" r="4" fill="#fbbf24"/>
  </g>

  <!-- Frame 6: Attack Impact (Sun Burst) -->
  <g transform="translate(288, 0)">
    <ellipse cx="26" cy="42" rx="15" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="17" y="15" width="17" height="14" rx="3" class="b-fire"/>
    <circle cx="40" cy="20" r="6" fill="#fbbf24"/>
    <polygon points="40,8 43,14 40,12" fill="#ef4444"/>
    <polygon points="40,32 43,26 40,28" fill="#ef4444"/>
    <polygon points="48,20 42,23 44,20" fill="#ef4444"/>
  </g>

  <!-- Frame 7: Hurt / Recoil -->
  <g transform="translate(336, 0)">
    <ellipse cx="18" cy="42" rx="10" ry="2.5" fill="rgba(0,0,0,0.2)"/>
    <rect x="12" y="16" width="18" height="14" rx="3" class="b-hurt"/>
    <rect x="18" y="8" width="12" height="11" rx="2" class="b-hurt"/>
    <line x1="22" y1="11" x2="26" y2="15" stroke="#ffffff" stroke-width="2"/>
    <line x1="26" y1="11" x2="22" y2="15" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
