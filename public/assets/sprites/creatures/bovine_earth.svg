<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .u-body  { fill: #78350f; }
      .u-plate { fill: #92400e; }
      .u-horn  { fill: #fef3c7; }
      .u-gold  { fill: #d97706; }
      .u-dark  { fill: #451a03; }
      .u-eye   { fill: #ef4444; }
      .u-hurt  { fill: #991b1b; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Titan Stance) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    <rect x="12" y="18" width="24" height="18" rx="3" class="u-body"/>
    <rect x="14" y="20" width="20" height="14" class="u-plate"/>
    <rect x="20" y="8" width="18" height="16" rx="2" class="u-body"/>
    <!-- Horns -->
    <path d="M22 10 Q16 4 12 8" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M36 10 Q42 4 46 8" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Snout & Ring -->
    <rect x="28" y="16" width="10" height="7" rx="1" class="u-dark"/>
    <circle cx="33" cy="22" r="2.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <rect x="25" y="12" width="3" height="3" class="u-eye"/>
    <!-- Hooves -->
    <rect x="14" y="36" width="6" height="4" class="u-dark"/>
    <rect x="28" y="36" width="6" height="4" class="u-dark"/>
  </g>

  <!-- Frame 1: Idle 2 (Breathe Heavy) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="42" rx="17" ry="4" fill="rgba(0,0,0,0.4)"/>
    <rect x="11" y="19" width="26" height="17" rx="3" class="u-body"/>
    <rect x="13" y="21" width="22" height="13" class="u-plate"/>
    <rect x="20" y="10" width="18" height="15" rx="2" class="u-body"/>
    <path d="M22 12 Q16 6 12 10" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M36 12 Q42 6 46 10" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="28" y="18" width="10" height="6" rx="1" class="u-dark"/>
    <circle cx="33" cy="23" r="2.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <rect x="25" y="14" width="3" height="2" class="u-eye"/>
    <rect x="13" y="36" width="7" height="4" class="u-dark"/>
    <rect x="28" y="36" width="7" height="4" class="u-dark"/>
  </g>

  <!-- Frame 2: Idle 3 (Hoof Stomp) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="42" rx="15" ry="3.5" fill="rgba(0,0,0,0.3)"/>
    <rect x="12" y="17" width="24" height="18" rx="3" class="u-body"/>
    <rect x="14" y="19" width="20" height="14" class="u-plate"/>
    <rect x="20" y="7" width="18" height="16" rx="2" class="u-body"/>
    <path d="M22 9 Q16 3 12 7" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M36 9 Q42 3 46 7" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="28" y="15" width="10" height="7" rx="1" class="u-dark"/>
    <circle cx="33" cy="21" r="2.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <rect x="25" y="11" width="3" height="3" class="u-eye"/>
    <!-- Raised Hoof -->
    <rect x="14" y="33" width="6" height="5" class="u-dark"/>
    <rect x="28" y="36" width="6" height="4" class="u-dark"/>
  </g>

  <!-- Frame 3: Idle 4 (Steam Snort) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    <rect x="12" y="18" width="24" height="18" rx="3" class="u-body"/>
    <rect x="20" y="8" width="18" height="16" rx="2" class="u-body"/>
    <path d="M22 10 Q16 4 12 8" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M36 10 Q42 4 46 8" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="28" y="16" width="10" height="7" rx="1" class="u-dark"/>
    <rect x="25" y="12" width="3" height="3" class="u-eye"/>
    <!-- Steam Puffs -->
    <circle cx="40" cy="22" r="2" fill="rgba(255,255,255,0.7)"/>
    <circle cx="44" cy="20" r="2.5" fill="rgba(255,255,255,0.5)"/>
    <rect x="14" y="36" width="6" height="4" class="u-dark"/>
    <rect x="28" y="36" width="6" height="4" class="u-dark"/>
  </g>

  <!-- Frame 4: Attack Windup (Horn Charge Set) -->
  <g transform="translate(192, 0)">
    <ellipse cx="20" cy="42" rx="18" ry="4" fill="rgba(0,0,0,0.35)"/>
    <rect x="14" y="20" width="24" height="17" rx="3" class="u-dark"/>
    <rect x="16" y="14" width="18" height="15" rx="2" class="u-body"/>
    <path d="M18 16 Q12 10 8 14" stroke="#fef3c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M32 16 Q38 10 42 14" stroke="#fef3c7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Frame 5: Attack Strike (Horn Gore Lunge) -->
  <g transform="translate(240, 0)">
    <ellipse cx="30" cy="42" rx="18" ry="4" fill="rgba(0,0,0,0.35)"/>
    <rect x="16" y="17" width="26" height="17" rx="3" class="u-body"/>
    <rect x="26" y="9" width="18" height="15" rx="2" class="u-body"/>
    <path d="M28 11 Q36 2 44 8" stroke="#fef3c7" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Earth Quake Shockwave -->
    <polygon points="42,32 46,24 48,34 44,38" fill="#d97706"/>
  </g>

  <!-- Frame 6: Attack Impact (Seismic Cleave) -->
  <g transform="translate(288, 0)">
    <ellipse cx="28" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    <rect x="16" y="18" width="24" height="17" rx="3" class="u-body"/>
    <polygon points="40,16 48,12 44,24" fill="#fef3c7"/>
    <polygon points="42,28 47,20 46,36" fill="#f59e0b"/>
  </g>

  <!-- Frame 7: Hurt / Recoil -->
  <g transform="translate(336, 0)">
    <ellipse cx="18" cy="42" rx="14" ry="3" fill="rgba(0,0,0,0.2)"/>
    <rect x="10" y="18" width="24" height="18" rx="3" class="u-hurt"/>
    <rect x="18" y="8" width="18" height="16" rx="2" class="u-hurt"/>
    <line x1="22" y1="12" x2="26" y2="16" stroke="#ffffff" stroke-width="2"/>
    <line x1="26" y1="12" x2="22" y2="16" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
