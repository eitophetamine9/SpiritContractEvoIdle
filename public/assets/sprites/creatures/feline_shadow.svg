<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: transparent; }
      .p-dark { fill: #1e1b4b; }
      .p-body { fill: #4338ca; }
      .p-lite { fill: #818cf8; }
      .p-eye  { fill: #38bdf8; }
      .p-glow { fill: #c084fc; }
      .p-white{ fill: #ffffff; }
      .p-slash{ fill: #f43f5e; }
      .p-hurt { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Base Stance) [x: 0..48] -->
  <g transform="translate(0, 0)">
    <!-- Shadow -->
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <!-- Body -->
    <rect x="16" y="22" width="16" height="14" rx="2" class="p-body"/>
    <rect x="18" y="24" width="12" height="10" class="p-lite"/>
    <!-- Head -->
    <rect x="17" y="12" width="14" height="12" rx="2" class="p-body"/>
    <!-- Ears -->
    <polygon points="17,12 14,5 20,11" class="p-dark"/>
    <polygon points="31,12 34,5 28,11" class="p-dark"/>
    <!-- Eyes -->
    <rect x="19" y="16" width="3" height="3" class="p-eye"/>
    <rect x="26" y="16" width="3" height="3" class="p-eye"/>
    <!-- Tail -->
    <path d="M16 30 C10 28, 8 20, 12 16" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Paws -->
    <rect x="17" y="36" width="4" height="4" class="p-dark"/>
    <rect x="27" y="36" width="4" height="4" class="p-dark"/>
  </g>

  <!-- Frame 1: Idle 2 (Breathe Down) [x: 48..96] -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="42" rx="15" ry="4" fill="rgba(0,0,0,0.35)"/>
    <rect x="15" y="23" width="18" height="13" rx="2" class="p-body"/>
    <rect x="17" y="25" width="14" height="9" class="p-lite"/>
    <rect x="17" y="14" width="14" height="11" rx="2" class="p-body"/>
    <polygon points="17,14 14,7 20,13" class="p-dark"/>
    <polygon points="31,14 34,7 28,13" class="p-dark"/>
    <rect x="19" y="18" width="3" height="2" class="p-eye"/>
    <rect x="26" y="18" width="3" height="2" class="p-eye"/>
    <path d="M15 31 C8 29, 6 22, 11 18" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="16" y="36" width="5" height="4" class="p-dark"/>
    <rect x="27" y="36" width="5" height="4" class="p-dark"/>
  </g>

  <!-- Frame 2: Idle 3 (Float / Arch) [x: 96..144] -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="42" rx="13" ry="3.5" fill="rgba(0,0,0,0.25)"/>
    <rect x="16" y="20" width="16" height="15" rx="2" class="p-body"/>
    <rect x="18" y="22" width="12" height="11" class="p-lite"/>
    <rect x="17" y="10" width="14" height="12" rx="2" class="p-body"/>
    <polygon points="17,10 14,3 20,9" class="p-dark"/>
    <polygon points="31,10 34,3 28,9" class="p-dark"/>
    <rect x="19" y="14" width="3" height="3" class="p-eye"/>
    <rect x="26" y="14" width="3" height="3" class="p-eye"/>
    <circle cx="20" cy="15" r="1" class="p-white"/>
    <circle cx="27" cy="15" r="1" class="p-white"/>
    <path d="M16 28 C11 24, 10 16, 15 12" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="17" y="35" width="4" height="4" class="p-dark"/>
    <rect x="27" y="35" width="4" height="4" class="p-dark"/>
  </g>

  <!-- Frame 3: Idle 4 (Tail Wag + Sparkle) [x: 144..192] -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="16" y="21" width="16" height="14" rx="2" class="p-body"/>
    <rect x="18" y="23" width="12" height="10" class="p-lite"/>
    <rect x="17" y="11" width="14" height="12" rx="2" class="p-body"/>
    <polygon points="17,11 14,4 20,10" class="p-dark"/>
    <polygon points="31,11 34,4 28,10" class="p-dark"/>
    <rect x="19" y="15" width="3" height="3" class="p-eye"/>
    <rect x="26" y="15" width="3" height="3" class="p-eye"/>
    <path d="M16 29 C13 23, 14 14, 21 11" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="36,12 37,10 39,11 38,13" fill="#c084fc"/>
    <rect x="17" y="35" width="4" height="4" class="p-dark"/>
    <rect x="27" y="35" width="4" height="4" class="p-dark"/>
  </g>

  <!-- Frame 4: Attack Windup (Lean Back) [x: 192..240] -->
  <g transform="translate(192, 0)">
    <ellipse cx="20" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="12" y="22" width="16" height="13" rx="2" class="p-dark"/>
    <rect x="13" y="13" width="14" height="11" rx="2" class="p-body"/>
    <polygon points="13,13 10,6 16,12" class="p-dark"/>
    <polygon points="27,13 30,6 24,12" class="p-dark"/>
    <rect x="16" y="17" width="4" height="2" class="p-eye"/>
    <rect x="23" y="17" width="4" height="2" class="p-eye"/>
    <!-- Claw Glow -->
    <circle cx="28" cy="28" r="3" fill="#818cf8"/>
  </g>

  <!-- Frame 5: Attack Strike (Lunge Forward) [x: 240..288] -->
  <g transform="translate(240, 0)">
    <ellipse cx="28" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="18" y="20" width="18" height="12" rx="2" class="p-body"/>
    <rect x="24" y="12" width="15" height="11" rx="2" class="p-body"/>
    <rect x="29" y="15" width="4" height="3" class="p-eye"/>
    <!-- Slash Arc -->
    <path d="M36 6 Q44 20 38 38" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M34 10 Q40 22 36 34" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Claws Extended -->
    <polygon points="38,24 45,21 40,27" fill="#ffffff"/>
  </g>

  <!-- Frame 6: Attack Impact (Extended Flash) [x: 288..336] -->
  <g transform="translate(288, 0)">
    <ellipse cx="26" cy="42" rx="15" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="18" y="21" width="17" height="12" rx="2" class="p-body"/>
    <rect x="23" y="13" width="14" height="11" rx="2" class="p-body"/>
    <rect x="28" y="16" width="3" height="2" class="p-eye"/>
    <!-- Flash Sparks -->
    <polygon points="40,16 44,14 42,20 46,22 41,24" fill="#38bdf8"/>
    <circle cx="42" cy="18" r="2" fill="#ffffff"/>
  </g>

  <!-- Frame 7: Hurt / Recoil (Red Tint + Shift Back) [x: 336..384] -->
  <g transform="translate(336, 0)">
    <ellipse cx="20" cy="42" rx="12" ry="3" fill="rgba(0,0,0,0.2)"/>
    <rect x="10" y="21" width="16" height="14" rx="2" class="p-hurt"/>
    <rect x="11" y="11" width="14" height="12" rx="2" class="p-hurt"/>
    <polygon points="11,11 8,4 14,10" fill="#991b1b"/>
    <polygon points="25,11 28,4 22,10" fill="#991b1b"/>
    <!-- X eyes for hurt -->
    <line x1="14" y1="15" x2="18" y2="19" stroke="#ffffff" stroke-width="2"/>
    <line x1="18" y1="15" x2="14" y2="19" stroke="#ffffff" stroke-width="2"/>
    <line x1="21" y1="15" x2="25" y2="19" stroke="#ffffff" stroke-width="2"/>
    <line x1="25" y1="15" x2="21" y2="19" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
