<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .k-body   { fill: #0b1325; }
      .k-deep   { fill: #082f3a; }
      .k-mid    { fill: #0e5a6a; }
      .k-glow   { fill: #00e5ff; }
      .k-core   { fill: #00ffd5; }
      .k-eye    { fill: #facc15; }
      .k-tent   { fill: #117a8b; }
      .k-sucker { fill: #38bdf8; }
      .k-shadow { fill: rgba(0,0,0,0.35); }
      .k-hurt   { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Benthic Sovereign Floating) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="k-shadow"/>
    <!-- Outer undulating tentacles -->
    <path d="M12 28 Q6 34 8 42 Q10 38 14 34 Z" class="k-tent"/>
    <path d="M36 28 Q42 34 40 42 Q38 38 34 34 Z" class="k-tent"/>
    <!-- Main Crown / Mantle -->
    <path d="M14 26 C14 12, 34 12, 34 26 C31 32, 17 32, 14 26 Z" class="k-body"/>
    <path d="M16 24 C16 14, 32 14, 32 24 C29 28, 19 28, 16 24 Z" class="k-deep"/>
    <!-- Mantle Crest Spikes -->
    <polygon points="20,13 24,7 28,13" class="k-mid"/>
    <polygon points="15,17 17,10 20,15" class="k-mid"/>
    <polygon points="28,15 31,10 33,17" class="k-mid"/>
    <!-- Front undulating tentacles -->
    <path d="M18 28 Q15 36 17 43 Q20 37 21 31 Z" class="k-tent"/>
    <path d="M30 28 Q33 36 31 43 Q28 37 27 31 Z" class="k-tent"/>
    <path d="M22 30 Q24 38 25 44 Q25 38 26 30 Z" class="k-deep"/>
    <!-- Tentacle suckers -->
    <circle cx="10" cy="38" r="1.2" class="k-sucker"/>
    <circle cx="38" cy="38" r="1.2" class="k-sucker"/>
    <circle cx="17" cy="37" r="1.2" class="k-sucker"/>
    <circle cx="31" cy="37" r="1.2" class="k-sucker"/>
    <!-- Central Overlord Eye -->
    <circle cx="24" cy="22" r="4.5" class="k-glow"/>
    <circle cx="24" cy="22" r="3" class="k-core"/>
    <ellipse cx="24" cy="22" rx="1.2" ry="2.5" class="k-body"/>
  </g>

  <!-- Frame 1: Idle 2 (Undulate Down & Bioluminescent Pulse) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="44" rx="17" ry="4" class="k-shadow"/>
    <path d="M11 29 Q5 36 9 43 Q11 39 15 35 Z" class="k-tent"/>
    <path d="M37 29 Q43 36 39 43 Q37 39 33 35 Z" class="k-tent"/>
    <path d="M14 27 C14 13, 34 13, 34 27 C31 33, 17 33, 14 27 Z" class="k-body"/>
    <path d="M16 25 C16 15, 32 15, 32 25 C29 29, 19 29, 16 25 Z" class="k-deep"/>
    <polygon points="20,14 24,8 28,14" class="k-mid"/>
    <polygon points="15,18 17,11 20,16" class="k-mid"/>
    <polygon points="28,16 31,11 33,18" class="k-mid"/>
    <path d="M17 29 Q13 37 18 44 Q20 38 21 32 Z" class="k-tent"/>
    <path d="M31 29 Q35 37 30 44 Q28 38 27 32 Z" class="k-tent"/>
    <path d="M22 31 Q23 39 24 44 Q26 39 26 31 Z" class="k-deep"/>
    <circle cx="9" cy="39" r="1.4" class="k-glow"/>
    <circle cx="39" cy="39" r="1.4" class="k-glow"/>
    <circle cx="16" cy="38" r="1.3" class="k-glow"/>
    <circle cx="32" cy="38" r="1.3" class="k-glow"/>
    <circle cx="24" cy="23" r="5" class="k-glow"/>
    <circle cx="24" cy="23" r="3.2" class="k-eye"/>
    <ellipse cx="24" cy="23" rx="1.4" ry="2.6" class="k-body"/>
  </g>

  <!-- Frame 2: Idle 3 (Rise & Hover) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="44" rx="15" ry="3" class="k-shadow"/>
    <path d="M13 27 Q7 33 7 40 Q10 36 14 32 Z" class="k-tent"/>
    <path d="M35 27 Q41 33 41 40 Q38 36 34 32 Z" class="k-tent"/>
    <path d="M14 24 C14 10, 34 10, 34 24 C31 30, 17 30, 14 24 Z" class="k-body"/>
    <path d="M16 22 C16 12, 32 12, 32 22 C29 26, 19 26, 16 22 Z" class="k-deep"/>
    <polygon points="20,11 24,5 28,11" class="k-mid"/>
    <polygon points="15,15 17,8 20,13" class="k-mid"/>
    <polygon points="28,13 31,8 33,15" class="k-mid"/>
    <path d="M18 26 Q16 34 16 41 Q20 35 22 29 Z" class="k-tent"/>
    <path d="M30 26 Q32 34 32 41 Q28 35 26 29 Z" class="k-tent"/>
    <path d="M22 28 Q24 36 24 42 Q25 36 26 28 Z" class="k-deep"/>
    <circle cx="9" cy="36" r="1.2" class="k-sucker"/>
    <circle cx="39" cy="36" r="1.2" class="k-sucker"/>
    <circle cx="24" cy="20" r="4.2" class="k-glow"/>
    <circle cx="24" cy="20" r="2.8" class="k-core"/>
    <ellipse cx="24" cy="20" rx="1.1" ry="2.2" class="k-body"/>
  </g>

  <!-- Frame 3: Idle 4 (Focus Glow) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="k-shadow"/>
    <path d="M12 28 Q6 34 8 42 Q10 38 14 34 Z" class="k-tent"/>
    <path d="M36 28 Q42 34 40 42 Q38 38 34 34 Z" class="k-tent"/>
    <path d="M14 25 C14 11, 34 11, 34 25 C31 31, 17 31, 14 25 Z" class="k-body"/>
    <path d="M16 23 C16 13, 32 13, 32 23 C29 27, 19 27, 16 23 Z" class="k-deep"/>
    <polygon points="20,12 24,6 28,12" class="k-mid"/>
    <path d="M18 27 Q15 35 17 42 Q20 36 21 30 Z" class="k-tent"/>
    <path d="M30 27 Q33 35 31 42 Q28 36 27 30 Z" class="k-tent"/>
    <circle cx="24" cy="21" r="5" class="k-glow"/>
    <circle cx="24" cy="21" r="3.2" class="k-core"/>
    <ellipse cx="24" cy="21" rx="1.2" ry="2.5" class="k-body"/>
  </g>

  <!-- Frame 4: Attack 1 (Tentacles Coil Back) -->
  <g transform="translate(192, 0)">
    <ellipse cx="22" cy="44" rx="14" ry="3.2" class="k-shadow"/>
    <path d="M14 26 C12 12, 32 12, 32 26 C29 32, 17 32, 14 26 Z" class="k-body"/>
    <polygon points="18,12 22,6 26,12" class="k-mid"/>
    <!-- Coiled tentacles on right -->
    <path d="M28 24 Q36 16 42 22 Q44 30 36 32 Z" class="k-tent"/>
    <path d="M30 28 Q40 26 44 34 Q38 40 32 36 Z" class="k-glow"/>
    <circle cx="22" cy="22" r="4.5" class="k-eye"/>
    <circle cx="22" cy="22" r="2.8" class="k-body"/>
  </g>

  <!-- Frame 5: Attack 2 (Abyssal Tidal Strike / Crushing Tentacle Whip) -->
  <g transform="translate(240, 0)">
    <ellipse cx="26" cy="44" rx="18" ry="4" class="k-shadow"/>
    <path d="M10 24 C10 10, 30 10, 30 24 C28 30, 14 30, 10 24 Z" class="k-body"/>
    <!-- Giant lunging tentacle whip stretching across -->
    <path d="M22 22 Q34 10 46 16 Q48 24 38 28 Q30 30 24 30 Z" class="k-tent"/>
    <polygon points="44,14 48,18 42,22" class="k-glow"/>
    <circle cx="36" cy="18" r="1.8" class="k-sucker"/>
    <circle cx="42" cy="22" r="1.8" class="k-sucker"/>
    <!-- Water / Void Splash Sparks -->
    <circle cx="45" cy="10" r="1.5" class="k-glow"/>
    <circle cx="47" cy="28" r="1.2" class="k-core"/>
    <circle cx="20" cy="20" r="5" class="k-glow"/>
    <circle cx="20" cy="20" r="3.5" class="k-eye"/>
  </g>

  <!-- Frame 6: Attack 3 (Recoil & Swirl Recovery) -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="44" rx="16" ry="3.5" class="k-shadow"/>
    <path d="M12 26 C12 12, 32 12, 32 26 C29 32, 17 32, 12 26 Z" class="k-body"/>
    <polygon points="18,13 22,7 26,13" class="k-mid"/>
    <path d="M26 26 Q36 28 38 38 Q32 42 28 36 Z" class="k-tent"/>
    <path d="M14 28 Q10 36 12 42 Q16 40 18 34 Z" class="k-tent"/>
    <circle cx="22" cy="22" r="4.2" class="k-glow"/>
    <circle cx="22" cy="22" r="2.8" class="k-core"/>
  </g>

  <!-- Frame 7: Hurt (Flinch & Bio-Flash Disruption) -->
  <g transform="translate(336, 0)">
    <ellipse cx="22" cy="44" rx="13" ry="3" class="k-shadow"/>
    <!-- Reeled back, red flash aura -->
    <path d="M10 27 C10 14, 28 14, 28 27 C26 33, 14 33, 10 27 Z" class="k-hurt"/>
    <polygon points="15,14 19,8 23,14" class="k-body"/>
    <path d="M8 29 Q4 38 7 43 Q10 40 12 34 Z" class="k-hurt"/>
    <path d="M26 29 Q32 38 29 43 Q26 39 24 33 Z" class="k-hurt"/>
    <!-- Distorted Eye -->
    <circle cx="19" cy="23" r="4.8" class="k-eye"/>
    <ellipse cx="19" cy="23" rx="3" ry="1.2" class="k-body"/>
    <polygon points="21,18 24,14 26,19" class="k-glow"/>
  </g>
</svg>
