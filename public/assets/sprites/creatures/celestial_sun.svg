<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .s-gold  { fill: #f59e0b; }
      .s-sun   { fill: #fbbf24; }
      .s-white { fill: #ffffff; }
      .s-halo  { fill: #fef08a; opacity: 0.9; }
      .s-dark  { fill: #b45309; }
      .s-eye   { fill: #38bdf8; }
      .s-hurt  { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Solar Halo Stance) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <!-- Solar Halo Ring -->
    <circle cx="24" cy="16" r="14" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
    <!-- Mane / Robes -->
    <rect x="14" y="16" width="20" height="18" rx="4" class="s-gold"/>
    <rect x="17" y="18" width="14" height="14" class="s-sun"/>
    <!-- Head -->
    <rect x="18" y="10" width="12" height="11" rx="2" class="s-gold"/>
    <polygon points="21,10 24,3 27,10" class="s-halo"/>
    <rect x="20" y="13" width="3" height="3" class="s-eye"/>
    <rect x="25" y="13" width="3" height="3" class="s-eye"/>
    <!-- Golden Paws / Pedestal -->
    <rect x="15" y="34" width="5" height="5" class="s-dark"/>
    <rect x="28" y="34" width="5" height="5" class="s-dark"/>
  </g>

  <!-- Frame 1: Idle 2 (Halo Expand) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="42" rx="15" ry="4" fill="rgba(0,0,0,0.35)"/>
    <circle cx="24" cy="16" r="16" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 2"/>
    <rect x="14" y="17" width="20" height="17" rx="4" class="s-gold"/>
    <rect x="17" y="19" width="14" height="13" class="s-sun"/>
    <rect x="18" y="11" width="12" height="11" rx="2" class="s-gold"/>
    <polygon points="21,11 24,4 27,11" class="s-halo"/>
    <rect x="20" y="14" width="3" height="2" class="s-eye"/>
    <rect x="25" y="14" width="3" height="2" class="s-eye"/>
    <rect x="15" y="34" width="5" height="5" class="s-dark"/>
    <rect x="28" y="34" width="5" height="5" class="s-dark"/>
  </g>

  <!-- Frame 2: Idle 3 (Levitate High) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="42" rx="12" ry="3" fill="rgba(0,0,0,0.2)"/>
    <circle cx="24" cy="14" r="14" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="14" y="14" width="20" height="18" rx="4" class="s-gold"/>
    <rect x="17" y="16" width="14" height="14" class="s-sun"/>
    <rect x="18" y="8" width="12" height="11" rx="2" class="s-gold"/>
    <polygon points="21,8 24,1 27,8" class="s-halo"/>
    <rect x="20" y="11" width="3" height="3" class="s-eye"/>
    <rect x="25" y="11" width="3" height="3" class="s-eye"/>
    <circle cx="21" cy="12" r="1" class="s-white"/>
    <circle cx="26" cy="12" r="1" class="s-white"/>
    <rect x="15" y="32" width="5" height="5" class="s-dark"/>
    <rect x="28" y="32" width="5" height="5" class="s-dark"/>
  </g>

  <!-- Frame 3: Idle 4 (Solar Corona Pulse) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <circle cx="24" cy="15" r="15" fill="none" stroke="#fef08a" stroke-width="3"/>
    <rect x="14" y="15" width="20" height="18" rx="4" class="s-gold"/>
    <rect x="17" y="17" width="14" height="14" class="s-sun"/>
    <rect x="18" y="9" width="12" height="11" rx="2" class="s-gold"/>
    <polygon points="21,9 24,2 27,9" class="s-halo"/>
    <!-- Corona Flares -->
    <polygon points="10,15 6,15 8,13" class="s-sun"/>
    <polygon points="38,15 42,15 40,13" class="s-sun"/>
    <polygon points="24,2 24,-2 26,0" class="s-sun"/>
    <rect x="20" y="12" width="3" height="3" class="s-eye"/>
    <rect x="25" y="12" width="3" height="3" class="s-eye"/>
    <rect x="15" y="33" width="5" height="5" class="s-dark"/>
    <rect x="28" y="33" width="5" height="5" class="s-dark"/>
  </g>

  <!-- Frame 4: Attack Windup (Crucible Gather) -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="42" rx="14" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="14" y="16" width="20" height="18" rx="4" class="s-dark"/>
    <!-- Solar Flare Gather -->
    <circle cx="34" cy="16" r="6" fill="#fbbf24"/>
    <circle cx="34" cy="16" r="3" fill="#ffffff"/>
  </g>

  <!-- Frame 5: Attack Strike (Supernova Ray) -->
  <g transform="translate(240, 0)">
    <ellipse cx="26" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="14" y="15" width="20" height="18" rx="4" class="s-gold"/>
    <!-- Prismatic Ray -->
    <polygon points="28,12 48,6 48,26 28,20" fill="#fbbf24"/>
    <polygon points="30,14 48,10 48,22 30,18" fill="#ffffff"/>
  </g>

  <!-- Frame 6: Attack Impact (Sun Lance Explosion) -->
  <g transform="translate(288, 0)">
    <ellipse cx="26" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.3)"/>
    <rect x="14" y="15" width="20" height="18" rx="4" class="s-gold"/>
    <circle cx="42" cy="16" r="8" fill="#fbbf24"/>
    <circle cx="42" cy="16" r="5" fill="#ffffff"/>
    <polygon points="42,4 45,10 42,8" fill="#f59e0b"/>
    <polygon points="42,28 45,22 42,24" fill="#f59e0b"/>
  </g>

  <!-- Frame 7: Hurt / Recoil -->
  <g transform="translate(336, 0)">
    <ellipse cx="20" cy="42" rx="12" ry="3" fill="rgba(0,0,0,0.2)"/>
    <rect x="12" y="16" width="20" height="18" rx="4" class="s-hurt"/>
    <line x1="20" y1="13" x2="24" y2="17" stroke="#ffffff" stroke-width="2"/>
    <line x1="24" y1="13" x2="20" y2="17" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
