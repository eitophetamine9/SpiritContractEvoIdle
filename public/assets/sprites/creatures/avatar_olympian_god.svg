<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .o-navy   { fill: #0b1120; }
      .o-cape   { fill: #1e1b4b; }
      .o-armor  { fill: #c2410c; }
      .o-gold   { fill: #eab308; }
      .o-lite   { fill: #fde047; }
      .o-white  { fill: #ffffff; }
      .o-bolt   { fill: #38bdf8; }
      .o-halo   { fill: #00f2fe; }
      .o-shadow { fill: rgba(0,0,0,0.4); }
      .o-hurt   { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Hovering Celestial Sovereign) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="14" ry="3" class="o-shadow"/>
    <!-- Flowing Divine Cape -->
    <path d="M16 18 Q10 32 12 40 Q20 38 24 38 Q28 38 36 40 Q38 32 32 18 Z" class="o-cape"/>
    <!-- Floating Celestial Halo -->
    <ellipse cx="24" cy="9" rx="11" ry="3.5" stroke="#fde047" stroke-width="1.4" fill="none"/>
    <circle cx="24" cy="5" r="1.5" class="o-white"/>
    <!-- Head & Regal Crown -->
    <rect x="20" y="11" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="19,11 21,7 23,10 25,6 27,10 29,7 30,11" class="o-gold"/>
    <circle cx="22" cy="15" r="1" class="o-bolt"/>
    <circle cx="26" cy="15" r="1" class="o-bolt"/>
    <!-- Golden Cuirass & Pauldrons -->
    <rect x="18" y="20" width="12" height="12" rx="2" class="o-gold"/>
    <polygon points="14,19 19,19 18,25 13,22" class="o-lite"/>
    <polygon points="34,19 29,19 30,25 35,22" class="o-lite"/>
    <!-- Core Divinity Emblem -->
    <polygon points="24,22 27,26 24,30 21,26" class="o-white"/>
    <!-- Arm & Lightning Sceptre -->
    <rect x="30" y="24" width="4" height="6" class="o-gold"/>
    <line x1="33" y1="12" x2="33" y2="38" stroke="#eab308" stroke-width="2"/>
    <polygon points="33,8 30,14 36,14" class="o-lite"/>
    <polygon points="33,10 35,14 31,17 34,19 32,23" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
    <!-- Greaves -->
    <rect x="19" y="32" width="4" height="7" rx="1" class="o-gold"/>
    <rect x="25" y="32" width="4" height="7" rx="1" class="o-gold"/>
  </g>

  <!-- Frame 1: Idle 2 (Swell & Halo Glow) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="43" rx="15" ry="3.5" class="o-shadow"/>
    <path d="M16 19 Q9 33 11 41 Q20 39 24 39 Q28 39 37 41 Q39 33 32 19 Z" class="o-cape"/>
    <ellipse cx="24" cy="10" rx="12" ry="4" stroke="#ffffff" stroke-width="1.6" fill="none"/>
    <circle cx="24" cy="6" r="2" class="o-lite"/>
    <rect x="20" y="12" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="19,12 21,8 23,11 25,7 27,11 29,8 30,12" class="o-gold"/>
    <circle cx="22" cy="16" r="1.3" class="o-white"/>
    <circle cx="26" cy="16" r="1.3" class="o-white"/>
    <rect x="18" y="21" width="12" height="12" rx="2" class="o-gold"/>
    <polygon points="14,20 19,20 18,26 13,23" class="o-lite"/>
    <polygon points="34,20 29,20 30,26 35,23" class="o-lite"/>
    <polygon points="24,23 27,27 24,31 21,27" class="o-white"/>
    <line x1="33" y1="13" x2="33" y2="39" stroke="#fde047" stroke-width="2.2"/>
    <polygon points="33,9 29,15 37,15" class="o-white"/>
    <rect x="19" y="33" width="4" height="7" rx="1" class="o-gold"/>
    <rect x="25" y="33" width="4" height="7" rx="1" class="o-gold"/>
    <circle cx="36" cy="12" r="1.5" class="o-bolt"/>
  </g>

  <!-- Frame 2: Idle 3 (Levitate Higher) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="43" rx="13" ry="2.8" class="o-shadow"/>
    <path d="M16 17 Q10 31 12 39 Q20 37 24 37 Q28 37 36 39 Q38 31 32 17 Z" class="o-cape"/>
    <ellipse cx="24" cy="8" rx="11" ry="3.5" stroke="#fde047" stroke-width="1.4" fill="none"/>
    <circle cx="24" cy="4" r="1.5" class="o-white"/>
    <rect x="20" y="10" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="19,10 21,6 23,9 25,5 27,9 29,6 30,10" class="o-gold"/>
    <circle cx="22" cy="14" r="1" class="o-bolt"/>
    <circle cx="26" cy="14" r="1" class="o-bolt"/>
    <rect x="18" y="19" width="12" height="12" rx="2" class="o-gold"/>
    <polygon points="14,18 19,18 18,24 13,21" class="o-lite"/>
    <polygon points="34,18 29,18 30,24 35,21" class="o-lite"/>
    <polygon points="24,21 27,25 24,29 21,25" class="o-white"/>
    <line x1="33" y1="11" x2="33" y2="37" stroke="#eab308" stroke-width="2"/>
    <polygon points="33,7 30,13 36,13" class="o-lite"/>
    <rect x="19" y="31" width="4" height="7" rx="1" class="o-gold"/>
    <rect x="25" y="31" width="4" height="7" rx="1" class="o-gold"/>
  </g>

  <!-- Frame 3: Idle 4 (Thunder Spark) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43" rx="14" ry="3" class="o-shadow"/>
    <path d="M16 18 Q10 32 12 40 Q20 38 24 38 Q28 38 36 40 Q38 32 32 18 Z" class="o-cape"/>
    <ellipse cx="24" cy="9" rx="11" ry="3.5" stroke="#fde047" stroke-width="1.4" fill="none"/>
    <rect x="20" y="11" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="19,11 21,7 23,10 25,6 27,10 29,7 30,11" class="o-gold"/>
    <circle cx="22" cy="15" r="1.2" class="o-bolt"/>
    <circle cx="26" cy="15" r="1.2" class="o-bolt"/>
    <rect x="18" y="20" width="12" height="12" rx="2" class="o-gold"/>
    <polygon points="24,22 27,26 24,30 21,26" class="o-white"/>
    <line x1="33" y1="12" x2="33" y2="38" stroke="#fde047" stroke-width="2"/>
    <polygon points="33,8 30,14 36,14" class="o-white"/>
    <!-- Electric arc across chest -->
    <path d="M16 26 L22 24 L20 28 L28 25 L34 27" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Frame 4: Attack 1 (Raise Divine Sceptre) -->
  <g transform="translate(192, 0)">
    <ellipse cx="24" cy="43" rx="14" ry="3" class="o-shadow"/>
    <path d="M14 18 Q8 32 10 40 Q20 38 24 38 Q28 38 34 40 Q36 32 30 18 Z" class="o-cape"/>
    <ellipse cx="24" cy="7" rx="13" ry="4" stroke="#ffffff" stroke-width="1.8" fill="none"/>
    <rect x="20" y="10" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="19,10 21,6 23,9 25,5 27,9 29,6 30,10" class="o-gold"/>
    <circle cx="22" cy="14" r="1.5" class="o-white"/>
    <circle cx="26" cy="14" r="1.5" class="o-white"/>
    <rect x="18" y="19" width="12" height="12" rx="2" class="o-gold"/>
    <!-- Raised arm and sceptre angled skyward -->
    <line x1="28" y1="20" x2="38" y2="4" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="38,2 34,8 42,8" class="o-white"/>
    <circle cx="38" cy="4" r="5" class="o-halo" opacity="0.6"/>
  </g>

  <!-- Frame 5: Attack 2 (Cataclysmic Smite / Lightning Blast) -->
  <g transform="translate(240, 0)">
    <ellipse cx="26" cy="43" rx="18" ry="4" class="o-shadow"/>
    <path d="M12 18 Q6 32 8 40 Q18 38 22 38 Q28 38 36 40 Q38 32 32 18 Z" class="o-cape"/>
    <rect x="18" y="11" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="17,11 19,7 21,10 23,6 25,10 27,7 28,11" class="o-gold"/>
    <rect x="16" y="20" width="12" height="12" rx="2" class="o-gold"/>
    <!-- Sceptre pointed forward unleashing massive lightning spear -->
    <line x1="24" y1="24" x2="40" y2="24" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="40,20 48,24 40,28" class="o-lite"/>
    <!-- Lightning Bolt Jagged Smite -->
    <polygon points="34,14 42,20 38,22 46,24 40,26 48,32 40,30" class="o-bolt"/>
    <circle cx="44" cy="24" r="4" class="o-white"/>
  </g>

  <!-- Frame 6: Attack 3 (Holy Corona Recovery) -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="43" rx="15" ry="3.2" class="o-shadow"/>
    <path d="M15 18 Q9 32 11 40 Q20 38 24 38 Q28 38 35 40 Q37 32 31 18 Z" class="o-cape"/>
    <ellipse cx="24" cy="9" rx="11" ry="3.5" stroke="#fde047" stroke-width="1.4" fill="none"/>
    <rect x="20" y="11" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="19,11 21,7 23,10 25,6 27,10 29,7 30,11" class="o-gold"/>
    <rect x="18" y="20" width="12" height="12" rx="2" class="o-gold"/>
    <line x1="32" y1="14" x2="32" y2="38" stroke="#eab308" stroke-width="2"/>
    <circle cx="36" cy="18" r="2" class="o-white"/>
    <circle cx="16" cy="22" r="1.5" class="o-bolt"/>
  </g>

  <!-- Frame 7: Hurt (Flinch & Golden Shard Burst) -->
  <g transform="translate(336, 0)">
    <ellipse cx="22" cy="43" rx="13" ry="2.8" class="o-shadow"/>
    <path d="M14 20 Q8 34 10 42 Q18 40 22 40 Q26 40 32 42 Q34 34 28 20 Z" class="o-hurt"/>
    <rect x="18" y="13" width="8" height="9" rx="2" class="o-navy"/>
    <polygon points="17,13 19,9 21,12 23,8 25,12 27,9 28,13" class="o-gold"/>
    <rect x="16" y="22" width="12" height="12" rx="2" class="o-hurt"/>
    <!-- Broken halo / sparks -->
    <polygon points="26,10 29,6 28,12" class="o-lite"/>
    <polygon points="12,14 16,11 14,17" class="o-lite"/>
    <circle cx="20" cy="17" r="1.5" class="o-white"/>
  </g>
</svg>
