<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .d-body  { fill: #0284c7; }
      .d-lite  { fill: #38bdf8; }
      .d-belly { fill: #bae6fd; }
      .d-dark  { fill: #0369a1; }
      .d-eye   { fill: #f59e0b; }
      .d-teeth { fill: #ffffff; }
      .d-hurt  { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Apex Cruiser Stance) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="42" rx="14" ry="3.5" fill="rgba(0,0,0,0.25)"/>
    <!-- Tail Fin -->
    <polygon points="10,22 4,14 6,26" class="d-dark"/>
    <polygon points="10,24 2,32 7,26" class="d-dark"/>
    <!-- Torpedo Body -->
    <path d="M10 24 C14 16, 26 14, 38 20 C36 28, 24 32, 10 26 Z" class="d-body"/>
    <path d="M12 25 C20 27, 28 26, 36 22 C34 26, 24 30, 12 27 Z" class="d-belly"/>
    <!-- Dorsal Fin -->
    <polygon points="22,15 26,6 28,15" class="d-dark"/>
    <!-- Pectoral Fin -->
    <polygon points="24,28 28,36 32,28" class="d-lite"/>
    <circle cx="32" cy="18" r="2" class="d-eye"/>
  </g>

  <!-- Frame 1: Idle 2 (Undulate Down) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="42" rx="15" ry="4" fill="rgba(0,0,0,0.3)"/>
    <polygon points="10,24 5,16 7,28" class="d-dark"/>
    <polygon points="10,26 3,34 8,28" class="d-dark"/>
    <path d="M10 26 C15 18, 27 16, 38 22 C36 30, 24 33, 10 28 Z" class="d-body"/>
    <path d="M12 27 C20 29, 28 28, 36 24 C34 28, 24 31, 12 29 Z" class="d-belly"/>
    <polygon points="22,17 26,8 28,17" class="d-dark"/>
    <polygon points="24,30 28,37 32,30" class="d-lite"/>
    <circle cx="32" cy="20" r="2" class="d-eye"/>
  </g>

  <!-- Frame 2: Idle 3 (Undulate Up) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="42" rx="13" ry="3" fill="rgba(0,0,0,0.2)"/>
    <polygon points="10,21 3,13 6,24" class="d-dark"/>
    <polygon points="10,23 2,30 7,24" class="d-dark"/>
    <path d="M10 22 C14 14, 26 12, 38 18 C36 26, 24 30, 10 24 Z" class="d-body"/>
    <path d="M12 23 C20 25, 28 24, 36 20 C34 24, 24 28, 12 25 Z" class="d-belly"/>
    <polygon points="22,13 26,4 28,13" class="d-dark"/>
    <polygon points="24,26 28,34 32,26" class="d-lite"/>
    <circle cx="32" cy="16" r="2" class="d-eye"/>
  </g>

  <!-- Frame 3: Idle 4 (Jaw Snarl) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="42" rx="14" ry="3.5" fill="rgba(0,0,0,0.25)"/>
    <polygon points="10,22 4,14 6,26" class="d-dark"/>
    <path d="M10 24 C14 16, 26 14, 38 20 C36 28, 24 32, 10 26 Z" class="d-body"/>
    <polygon points="34,22 36,25 38,22" class="d-teeth"/>
    <circle cx="32" cy="18" r="2" class="d-eye"/>
  </g>

  <!-- Frame 4: Attack Windup (Coil Back) -->
  <g transform="translate(192, 0)">
    <ellipse cx="20" cy="42" rx="14" ry="3.5" fill="rgba(0,0,0,0.3)"/>
    <path d="M6 24 C12 14, 22 14, 32 20 Z" class="d-dark"/>
    <!-- Water Vortex -->
    <path d="M26 12 Q36 6 34 22" stroke="#38bdf8" stroke-width="3" fill="none"/>
  </g>

  <!-- Frame 5: Attack Strike (Tidal Chomp Lunge) -->
  <g transform="translate(240, 0)">
    <ellipse cx="28" cy="42" rx="16" ry="4" fill="rgba(0,0,0,0.35)"/>
    <path d="M14 22 C20 12, 34 12, 44 20 Z" class="d-body"/>
    <!-- Huge Jaws -->
    <polygon points="38,16 46,12 42,20" class="d-teeth"/>
    <polygon points="38,24 46,28 42,20" class="d-teeth"/>
    <!-- Water Splash -->
    <circle cx="46" cy="14" r="2" fill="#bae6fd"/>
    <circle cx="48" cy="24" r="2.5" fill="#bae6fd"/>
  </g>

  <!-- Frame 6: Attack Impact (Abyssal Torrent) -->
  <g transform="translate(288, 0)">
    <ellipse cx="26" cy="42" rx="15" ry="4" fill="rgba(0,0,0,0.3)"/>
    <path d="M14 22 C20 14, 32 14, 42 20 Z" class="d-body"/>
    <!-- Wave Jet -->
    <ellipse cx="44" cy="20" rx="4" ry="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Frame 7: Hurt / Recoil -->
  <g transform="translate(336, 0)">
    <ellipse cx="18" cy="42" rx="12" ry="2.5" fill="rgba(0,0,0,0.2)"/>
    <path d="M8 24 C14 16, 26 14, 36 20 Z" class="d-hurt"/>
    <line x1="26" y1="16" x2="30" y2="20" stroke="#ffffff" stroke-width="2"/>
    <line x1="30" y1="16" x2="26" y2="20" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
