<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 48" width="384" height="48" shape-rendering="crispEdges">
  <defs>
    <style>
      .c-body   { fill: #20132b; }
      .c-armor  { fill: #3b1d54; }
      .c-bile   { fill: #16a34a; }
      .c-venom  { fill: #22c55e; }
      .c-acid   { fill: #a3e635; }
      .c-glow   { fill: #facc15; }
      .c-horn   { fill: #581c87; }
      .c-serp   { fill: #15803d; }
      .c-shadow { fill: rgba(0,0,0,0.35); }
      .c-hurt   { fill: #ef4444; }
    </style>
  </defs>

  <!-- Frame 0: Idle 1 (Apex Beast Stance) -->
  <g transform="translate(0, 0)">
    <ellipse cx="24" cy="43" rx="16" ry="3.5" class="c-shadow"/>
    <!-- Serpent Tail arching over back -->
    <path d="M12 30 Q6 20 12 12 Q16 10 14 16 Q10 24 16 30 Z" class="c-serp"/>
    <polygon points="12,12 16,9 15,14" class="c-acid"/>
    <circle cx="13" cy="11" r="0.8" class="c-glow"/>
    <!-- Quadruped Body -->
    <rect x="14" y="24" width="20" height="13" rx="3" class="c-body"/>
    <rect x="16" y="26" width="16" height="9" class="c-armor"/>
    <!-- Front Mane & Head -->
    <path d="M24 18 C28 14, 38 16, 38 24 C38 29, 30 32, 24 28 Z" class="c-body"/>
    <polygon points="26,14 30,7 28,15" class="c-horn"/>
    <polygon points="31,15 36,8 33,16" class="c-horn"/>
    <!-- Snout & Venom Teeth -->
    <polygon points="36,24 43,26 36,28" class="c-armor"/>
    <polygon points="39,26 41,27 39,28" class="c-acid"/>
    <!-- Eyes -->
    <circle cx="32" cy="20" r="1.8" class="c-acid"/>
    <circle cx="32" cy="20" r="0.8" class="c-glow"/>
    <!-- Claws / Paws -->
    <rect x="15" y="36" width="5" height="6" rx="1" class="c-body"/>
    <rect x="28" y="36" width="5" height="6" rx="1" class="c-body"/>
    <!-- Dripping Bile Nodes on Flank -->
    <circle cx="20" cy="28" r="1.8" class="c-venom"/>
    <circle cx="25" cy="30" r="1.4" class="c-acid"/>
  </g>

  <!-- Frame 1: Idle 2 (Bile Pulse & Heavy Breath) -->
  <g transform="translate(48, 0)">
    <ellipse cx="24" cy="43" rx="17" ry="4" class="c-shadow"/>
    <path d="M12 31 Q6 21 12 13 Q16 11 14 17 Q10 25 16 31 Z" class="c-serp"/>
    <polygon points="12,13 16,10 15,15" class="c-acid"/>
    <rect x="14" y="25" width="20" height="13" rx="3" class="c-body"/>
    <rect x="16" y="27" width="16" height="9" class="c-armor"/>
    <path d="M24 19 C28 15, 38 17, 38 25 C38 30, 30 33, 24 29 Z" class="c-body"/>
    <polygon points="26,15 30,8 28,16" class="c-horn"/>
    <polygon points="31,16 36,9 33,17" class="c-horn"/>
    <polygon points="36,25 43,27 36,29" class="c-armor"/>
    <polygon points="39,27 41,28 39,29" class="c-acid"/>
    <circle cx="32" cy="21" r="2.2" class="c-acid"/>
    <circle cx="32" cy="21" r="1.0" class="c-glow"/>
    <rect x="15" y="36" width="5" height="6" rx="1" class="c-body"/>
    <rect x="28" y="36" width="5" height="6" rx="1" class="c-body"/>
    <circle cx="20" cy="29" r="2.2" class="c-acid"/>
    <circle cx="25" cy="31" r="1.8" class="c-venom"/>
  </g>

  <!-- Frame 2: Idle 3 (Rise & Tail Hiss) -->
  <g transform="translate(96, 0)">
    <ellipse cx="24" cy="43" rx="15" ry="3.2" class="c-shadow"/>
    <path d="M12 29 Q5 18 13 10 Q17 8 15 15 Q10 23 16 29 Z" class="c-serp"/>
    <polygon points="13,10 17,7 16,12" class="c-acid"/>
    <rect x="14" y="23" width="20" height="13" rx="3" class="c-body"/>
    <rect x="16" y="25" width="16" height="9" class="c-armor"/>
    <path d="M24 17 C28 13, 38 15, 38 23 C38 28, 30 31, 24 27 Z" class="c-body"/>
    <polygon points="26,13 30,6 28,14" class="c-horn"/>
    <polygon points="31,14 36,7 33,15" class="c-horn"/>
    <polygon points="36,23 43,25 36,27" class="c-armor"/>
    <circle cx="32" cy="19" r="1.8" class="c-acid"/>
    <rect x="15" y="35" width="5" height="7" rx="1" class="c-body"/>
    <rect x="28" y="35" width="5" height="7" rx="1" class="c-body"/>
    <circle cx="20" cy="27" r="1.8" class="c-venom"/>
    <circle cx="25" cy="29" r="1.4" class="c-acid"/>
  </g>

  <!-- Frame 3: Idle 4 (Virulent Snarl) -->
  <g transform="translate(144, 0)">
    <ellipse cx="24" cy="43" rx="16" ry="3.5" class="c-shadow"/>
    <path d="M12 30 Q6 20 12 12 Q16 10 14 16 Q10 24 16 30 Z" class="c-serp"/>
    <rect x="14" y="24" width="20" height="13" rx="3" class="c-body"/>
    <rect x="16" y="26" width="16" height="9" class="c-armor"/>
    <path d="M24 18 C28 14, 38 16, 38 24 C38 29, 30 32, 24 28 Z" class="c-body"/>
    <polygon points="36,23 44,24 37,26" class="c-armor"/>
    <polygon points="36,27 44,29 37,30" class="c-armor"/>
    <polygon points="40,25 42,26 40,27" class="c-acid"/>
    <circle cx="32" cy="20" r="2" class="c-acid"/>
    <rect x="15" y="36" width="5" height="6" rx="1" class="c-body"/>
    <rect x="28" y="36" width="5" height="6" rx="1" class="c-body"/>
  </g>

  <!-- Frame 4: Attack 1 (Crouch & Tail Venom Gather) -->
  <g transform="translate(192, 0)">
    <ellipse cx="22" cy="43" rx="15" ry="3.5" class="c-shadow"/>
    <path d="M10 32 Q4 22 10 14 Q14 12 12 18 Q8 26 14 32 Z" class="c-serp"/>
    <rect x="12" y="26" width="20" height="12" rx="3" class="c-body"/>
    <path d="M22 20 C26 16, 34 18, 34 26 C34 30, 26 33, 22 29 Z" class="c-body"/>
    <circle cx="34" cy="24" r="4" class="c-acid"/>
    <circle cx="30" cy="22" r="2" class="c-glow"/>
  </g>

  <!-- Frame 5: Attack 2 (Virulent Acid Pounce & Claw Strike) -->
  <g transform="translate(240, 0)">
    <ellipse cx="26" cy="43" rx="18" ry="4" class="c-shadow"/>
    <path d="M8 28 Q4 18 12 10 Q16 8 14 14 Q10 22 14 28 Z" class="c-serp"/>
    <path d="M12 24 C18 18, 32 18, 38 22 C34 28, 22 30, 12 28 Z" class="c-body"/>
    <!-- Lunging Front Claw -->
    <polygon points="36,22 46,16 42,26" class="c-armor"/>
    <polygon points="44,18 48,16 46,22" class="c-acid"/>
    <!-- Virulent Bile Acid Spray -->
    <polygon points="40,24 48,22 46,28" class="c-venom"/>
    <circle cx="47" cy="18" r="1.5" class="c-acid"/>
    <circle cx="45" cy="29" r="1.2" class="c-venom"/>
    <circle cx="32" cy="20" r="2.2" class="c-glow"/>
  </g>

  <!-- Frame 6: Attack 3 (Landing & Bile Cloud Recoil) -->
  <g transform="translate(288, 0)">
    <ellipse cx="24" cy="43" rx="16" ry="3.5" class="c-shadow"/>
    <rect x="14" y="25" width="20" height="13" rx="3" class="c-body"/>
    <path d="M24 19 C28 15, 36 17, 36 25 C36 29, 28 32, 24 28 Z" class="c-body"/>
    <circle cx="40" cy="26" r="2" class="c-venom"/>
    <circle cx="44" cy="22" r="1.5" class="c-acid"/>
    <circle cx="32" cy="21" r="1.8" class="c-acid"/>
  </g>

  <!-- Frame 7: Hurt (Flinch & Venom Rupture) -->
  <g transform="translate(336, 0)">
    <ellipse cx="20" cy="43" rx="13" ry="3" class="c-shadow"/>
    <rect x="10" y="26" width="18" height="12" rx="3" class="c-hurt"/>
    <path d="M18 20 C22 16, 30 18, 30 26 C30 30, 22 33, 18 29 Z" class="c-hurt"/>
    <polygon points="20,15 24,9 22,16" class="c-horn"/>
    <circle cx="26" cy="22" r="2" class="c-glow"/>
    <circle cx="14" cy="24" r="2" class="c-acid"/>
    <circle cx="28" cy="18" r="1.5" class="c-acid"/>
  </g>
</svg>
