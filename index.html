<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Spirit Contract Evo Idle - Contract spirits, train AFK, evolve through RNG, and battle corrupted beasts in the Madness Zone." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Spirit Contract Evo | Idle</title>
  </head>
  <body>
    <div id="app">
      <!-- Sticky Header -->
      <header class="app-header">
        <div class="header-top">
          <div class="game-title">
            <span class="game-title-text">⛩️ Spirit Contract Evo</span>
          </div>
          <div class="header-right-actions">
            <div id="save-status" class="save-indicator">
              <span class="save-dot">●</span> 💾 Saved
            </div>
            <button id="btn-top-auth" class="header-auth-btn" title="Contractor Cloud Account & Saves">
              <span id="auth-status-icon">☁️</span>
              <span id="auth-status-text">Guest</span>
            </button>
            <button id="btn-top-audio" class="header-audio-btn" title="Toggle Sound & Music">
              <span id="audio-icon-symbol">🔊</span>
            </button>
            <button id="btn-top-index" class="header-profile-btn" data-tab="index" title="Spirit Bestiary & Lineages">
              <span class="profile-avatar-icon">📖</span>
              <span class="profile-btn-text">Index</span>
            </button>
            <button id="btn-top-profile" class="header-profile-btn" data-tab="profile" title="Contractor Profile">
              <span class="profile-avatar-icon">🧙‍♂️</span>
              <span class="profile-btn-text">Profile</span>
            </button>
          </div>
        </div>

        <div class="resources-bar">
          <div class="resource-pill energy-pill">
            <span class="resource-label">⚡ Energy:</span>
            <span id="res-energy" class="resource-val">60/60</span>
          </div>
          <div class="resource-pill shards-pill">
            <span class="resource-label">💎 Shards:</span>
            <span id="res-shards" class="resource-val">0</span>
          </div>
          <div class="resource-pill essence-pill" title="Astral Essence">
            <span class="resource-label">🔮 Astral:</span>
            <span id="res-essence" class="resource-val">0</span>
          </div>
          <div class="resource-pill god-essence-pill" title="Essences of the Gods (Dismantled Relics & Sanctuary Dungeon)">
            <span class="resource-label">✨ Gods:</span>
            <span id="res-god-essences" class="resource-val">0</span>
          </div>
        </div>
      </header>

      <!-- Active Screen View Content -->
      <main id="view-container" class="view-content"></main>

      <!-- Fixed Bottom Navigation (3 Main Icons + Menu Drawer) -->
      <nav class="bottom-nav" id="bottom-nav-dock">
        <button id="nav-madness" class="nav-tab active" data-tab="madness" title="Madness Zone Combat">
          <span class="tab-icon">⚔️</span>
          <span class="tab-label">Madness</span>
        </button>

        <button id="nav-contract" class="nav-tab" data-tab="contract" title="Summon & Contract Altar">
          <span class="tab-icon">🔮</span>
          <span class="tab-label">Summon</span>
        </button>

        <button id="nav-party" class="nav-tab" data-tab="party" title="Hero Party & Pedestal">
          <span class="tab-icon">⛩️</span>
          <span class="tab-label">Party</span>
          <span id="party-evolve-badge" class="nav-badge" style="display: none;">!</span>
        </button>

        <button id="nav-menu-toggle" class="nav-tab nav-burger-btn" title="Open Realms & Features Menu">
          <span class="tab-icon">☰</span>
          <span class="tab-label">Menu</span>
        </button>
      </nav>

      <!-- Slide-Up Menu Drawer Layer for Secondary Tabs -->
      <div id="nav-drawer-backdrop" class="nav-drawer-backdrop" style="display: none;">
        <div id="nav-drawer-panel" class="nav-drawer-panel">
          <div class="nav-drawer-header">
            <div class="nav-drawer-title">
              <span class="nav-drawer-icon">⛩️</span>
              <span>Sanctums & Realms</span>
            </div>
            <button id="btn-close-nav-drawer" class="nav-drawer-close-btn" title="Close Menu">✕</button>
          </div>

          <div class="nav-drawer-grid">
            <button class="nav-drawer-item" data-tab="sanctum" title="Spirit Sanctum (Dedicated Character & Rebirth Hub)">
              <span class="drawer-item-icon">🌟</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Sanctum</span>
                <span class="drawer-item-desc">Character & Rebirth</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="trials" title="Pantheon Relic Trials">
              <span class="drawer-item-icon">🏛️</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Trials</span>
                <span class="drawer-item-desc">Greek God Relics</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="forge" title="The Divine Forge (Weapon Dungeon)">
              <span class="drawer-item-icon">🔨</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Forge</span>
                <span class="drawer-item-desc">Smelt Weapons</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="mystical" title="The Mystical Realm">
              <span class="drawer-item-icon">✨</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Realm</span>
                <span class="drawer-item-desc">Zodiac & Essences</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="vault" title="The Arcane Vault">
              <span class="drawer-item-icon">📜</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Vault</span>
                <span class="drawer-item-desc">Card Collection</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="index" title="Bestiary & Evolution Lineages">
              <span class="drawer-item-icon">📖</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Index</span>
                <span class="drawer-item-desc">Spirit Bestiary</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="profile" title="Contractor Profile">
              <span class="drawer-item-icon">🧙‍♂️</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Profile</span>
                <span class="drawer-item-desc">Stats & Records</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- Modal Injection Layer -->
      <div id="modal-root"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
