<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Spirit Contract Evo Idle - Contract spirits, train AFK, evolve through RNG, and battle corrupted beasts in the Madness Zone." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Spirit Contract Evo | Idle</title>
  </head>
  <body>
    <!-- Title / Home Screen Gateway Layer -->
    <div id="title-screen-root"></div>

    <div id="app">
      <!-- Sticky Header -->
      <header class="app-header">
        <div class="header-top">
          <div class="game-title" id="btn-header-title" style="cursor: pointer;" title="Return to Title Screen">
            <span class="game-title-text">⛩️ Spirit Contract Evo</span>
          </div>
          <div class="header-right-actions">
            <div id="save-status" class="save-indicator" title="Save & Cloud Status (Click to manage)" style="cursor: pointer;">
              <span class="save-dot">●</span> 💾 Local
            </div>
            <button id="btn-top-audio" class="header-audio-btn" title="Toggle Sound & Music">
              <span id="audio-icon-symbol">🔊</span>
            </button>
            <button id="btn-top-profile" class="header-profile-btn" data-tab="profile" title="Contractor Profile">
              <span class="profile-avatar-icon">🧙‍♂️</span>
              <span class="profile-btn-text">Profile</span>
            </button>
          </div>
        </div>

        <div class="resources-bar">
          <div class="resource-pill energy-pill" title="Madness Energy">
            <span class="resource-label"><svg class="game-svg-icon" style="width:12px; height:12px; display:inline-block; vertical-align:-1px; color:#facc15;" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg> Energy:</span>
            <span id="res-energy" class="resource-val">60/60</span>
          </div>
          <div class="resource-pill shards-pill" title="Spirit Shards">
            <span class="resource-label"><svg class="game-svg-icon" style="width:12px; height:12px; display:inline-block; vertical-align:-1px; color:#38bdf8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20"/><path d="m12 21 4-12"/><path d="m12 21-4-12"/></svg> Shards:</span>
            <span id="res-shards" class="resource-val">0</span>
          </div>
          <div class="resource-pill purified-pill" title="Purified Soul Essence (Contract Summoning)">
            <span class="resource-label"><svg class="game-svg-icon" style="width:12px; height:12px; display:inline-block; vertical-align:-1px; color:#fde047;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke="#facc15" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="5" fill="#fef08a" fill-opacity="0.4" stroke="#facc15"/><circle cx="12" cy="12" r="2" fill="#ffffff"/></svg> Soul:</span>
            <span id="res-purified" class="resource-val">3</span>
          </div>
          <div class="resource-pill essence-pill" title="Astral Essence">
            <span class="resource-label"><svg class="game-svg-icon" style="width:12px; height:12px; display:inline-block; vertical-align:-1px; color:#c084fc;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8" fill="#a855f7" fill-opacity="0.3"/><ellipse cx="12" cy="12" rx="10" ry="4" stroke="#e879f9" transform="rotate(-30 12 12)"/></svg> Astral:</span>
            <span id="res-essence" class="resource-val">0</span>
          </div>
          <div class="resource-pill god-essence-pill" title="Essences of the Gods (Dismantled Relics & Sanctuary Dungeon)">
            <span class="resource-label"><svg class="game-svg-icon" style="width:12px; height:12px; display:inline-block; vertical-align:-1px; color:#fb923c;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h8a2 2 0 0 1 2 2v2a6 6 0 0 1-4 5.66V17h3a2 2 0 0 1 2 2v2H5v-2a2 2 0 0 1 2-2h3v-4.34A6 6 0 0 1 6 7V5a2 2 0 0 1 2-2z"/><path d="M6 7H4a2 2 0 0 0-2 2v1a4 4 0 0 0 4 4"/><path d="M18 7h2a2 2 0 0 1 2 2v1a4 4 0 0 1-4 4"/></svg> Gods:</span>
            <span id="res-god-essences" class="resource-val">0</span>
          </div>
        </div>
      </header>

      <!-- Active Screen View Content -->
      <main id="view-container" class="view-content"></main>

      <!-- Fixed Bottom Navigation (3 Main Icons + Menu Drawer) -->
      <nav class="bottom-nav" id="bottom-nav-dock">
        <button id="nav-madness" class="nav-tab active" data-tab="madness" title="Madness Zone Combat">
          <span class="tab-icon"><svg class="game-svg-icon" style="width:20px; height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 17.5 3 3a1.414 1.414 0 0 0 2-2l-3-3"/><path d="m5 19 3-3"/><path d="m19 5-3 3"/><path d="m9.5 6.5-3-3a1.414 1.414 0 0 0-2 2l3 3"/><path d="m7.5 14.5 9-9"/><path d="m6.5 9.5 9 9"/></svg></span>
          <span class="tab-label">Madness</span>
        </button>

        <button id="nav-contract" class="nav-tab" data-tab="contract" title="Summon & Contract Altar">
          <span class="tab-icon"><svg class="game-svg-icon" style="width:20px; height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/><circle cx="12" cy="12" r="3" fill="currentColor" fill-opacity="0.3"/></svg></span>
          <span class="tab-label">Summon</span>
        </button>

        <button id="nav-party" class="nav-tab" data-tab="party" title="Hero Party & Pedestal">
          <span class="tab-icon"><svg class="game-svg-icon" style="width:20px; height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span class="tab-label">Party</span>
          <span id="party-evolve-badge" class="nav-badge" style="display: none;">!</span>
        </button>

        <button id="nav-menu-toggle" class="nav-tab nav-burger-btn" title="Open Realms & Features Menu">
          <span class="tab-icon"><svg class="game-svg-icon" style="width:20px; height:20px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></span>
          <span class="tab-label">Menu</span>
        </button>
      </nav>

      <!-- Slide-Up Menu Drawer Layer for Secondary Tabs -->
      <div id="nav-drawer-backdrop" class="nav-drawer-backdrop" style="display: none;">
        <div id="nav-drawer-panel" class="nav-drawer-panel">
          <div class="nav-drawer-header">
            <div class="nav-drawer-title">
              <span class="nav-drawer-icon"><svg class="game-svg-icon" style="width:20px; height:20px; color:#ffd152;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></svg></span>
              <span>Sanctums & Realms</span>
            </div>
            <button id="btn-close-nav-drawer" class="nav-drawer-close-btn" title="Close Menu">✕</button>
          </div>

          <div class="nav-drawer-grid">
            <button class="nav-drawer-item" data-tab="sanctum" title="Spirit Sanctum (Dedicated Character & Rebirth Hub)">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#facc15;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 9 9l-7 1 5 5-1 7 6-3 6 3-1-7 5-5-7-1z"/><circle cx="12" cy="12" r="3" fill="currentColor" fill-opacity="0.25"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Sanctum</span>
                <span class="drawer-item-desc">Character & Rebirth</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="trials" title="Pantheon Relic Trials">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#38bdf8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M4 18h16"/><path d="M4 14h16"/><path d="M6 14v4"/><path d="M10 14v4"/><path d="M14 14v4"/><path d="M18 14v4"/><path d="m12 3 9 7H3z"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Trials</span>
                <span class="drawer-item-desc">Greek God Relics</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="forge" title="The Divine Forge (Weapon Dungeon)">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#fb923c;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 10H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h4"/><path d="M17 10h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-4"/><path d="M7 14h10v3a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4v-3z"/><path d="M8 10V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v5"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Forge</span>
                <span class="drawer-item-desc">Smelt Weapons</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="mystical" title="The Mystical Realm">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#e879f9;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(-30 12 12)"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Realm</span>
                <span class="drawer-item-desc">Zodiac & Essences</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="vault" title="The Arcane Vault">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#fbbf24;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><circle cx="12" cy="14" r="2"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Vault</span>
                <span class="drawer-item-desc">Card Collection</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="index" title="Bestiary & Evolution Lineages">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#34d399;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/><path d="M6 14h6"/><path d="M4 19.5a2.5 2.5 0 0 1 2.5-2.5H20"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Index</span>
                <span class="drawer-item-desc">Spirit Bestiary</span>
              </div>
            </button>

            <button class="nav-drawer-item" data-tab="profile" title="Contractor Profile">
              <span class="drawer-item-icon"><svg class="game-svg-icon" style="width:22px; height:22px; color:#a78bfa;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/><path d="m9 11 3-3 3 3"/></svg></span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Profile</span>
                <span class="drawer-item-desc">Stats & Records</span>
              </div>
            </button>

            <button class="nav-drawer-item" id="btn-drawer-auth" title="Cloud Account & Saves">
              <span class="drawer-item-icon">☁️</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Account</span>
                <span class="drawer-item-desc">Cloud Save Sync</span>
              </div>
            </button>

            <button class="nav-drawer-item" id="btn-drawer-home" title="Return to Title Screen">
              <span class="drawer-item-icon">🏠</span>
              <div class="drawer-item-info">
                <span class="drawer-item-name">Title Screen</span>
                <span class="drawer-item-desc">Gateway & Mode</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- Modal Injection Layer -->
      <div id="modal-root"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
